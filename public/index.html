      const input = document.getElementById('deleteAccountConfirmInput-'+accId);
      const statusEl = document.getElementById('deleteAccountStatus-'+accId);
      if(!input || input.value.trim() !== acc.name){
        if(statusEl) showStatus(statusEl,'err',`Scrivi esattamente "${acc.name}" per confermare.`);
        return;
      }
      await deleteAccount(accId);
      STATE.deleteConfirmAccId = null;
      render();
    });
  });

  const btnShowAddAccount = document.getElementById('btnShowAddAccount');
  if(btnShowAddAccount) btnShowAddAccount.addEventListener('click', ()=>{
    STATE.showAddAccount = !STATE.showAddAccount;
    render();
    if(STATE.showAddAccount){
      const inp = document.getElementById('newAccountCapital');
      if(inp) inp.focus();
    }
  });

  const btnConfirmAddAccount = document.getElementById('btnConfirmAddAccount');
  if(btnConfirmAddAccount) btnConfirmAddAccount.addEventListener('click', async ()=>{
    const statusEl = document.getElementById('addAccountStatus');
    const nameInput = document.getElementById('newAccountName').value.trim();
    const capital = parseFloat(document.getElementById('newAccountCapital').value);
    if(isNaN(capital) || capital<=0){
      showStatus(statusEl,'err','Inserisci un capitale di partenza valido.');
      return;
    }
    const acc = await createAccount(capital, nameInput || null);
    render();
    const target = document.querySelector('.acct-switcher');
    if(target && target.scrollIntoView) target.scrollIntoView({behavior:'smooth', block:'start'});
  });

  const btnUnlockNewAccount = document.getElementById('btnUnlockNewAccount');
  if(btnUnlockNewAccount) btnUnlockNewAccount.addEventListener('click', async ()=>{
    const statusEl = document.getElementById('unlockStatus');
    const amount = parseFloat(document.getElementById('newDepositAmount').value);
    if(isNaN(amount) || amount<=0){
      showStatus(statusEl,'err','Inserisci l\'importo del nuovo deposito.');
      return;
    }
    const acc = getActiveAccount();
    if(!acc) return;
    await unlockAccountWithDeposit(acc.id, amount);
    render();
  });

  const btnSimpleUnlock = document.getElementById('btnSimpleUnlock');
  if(btnSimpleUnlock) btnSimpleUnlock.addEventListener('click', async ()=>{
    const acc = getActiveAccount();
    if(!acc) return;
    await unlockAccountSimple(acc.id);
    render();
  });

  const btnResetEl = document.getElementById('btnReset');
  if(btnResetEl){
    let resetConfirmTimer = null;
    btnResetEl.addEventListener('click', async ()=>{
      const acc = getActiveAccount();
      if(!acc) return;
      if(btnResetEl.dataset.pending==='1'){
        clearTimeout(resetConfirmTimer);
        if(acc.id==='acc-1'){
          const others = STATE.trades.filter(t=>t.accountId!=='acc-1');
          STATE.trades = [...others, ...seedToTrades(SEED_TRADES_RAW).map(t=>({...t, accountId:'acc-1'}))];
        } else {
          STATE.trades = STATE.trades.filter(t=>t.accountId!==acc.id);
        }
        await saveTrades(STATE.trades);
        btnResetEl.dataset.pending='0';
        render();
        return;
      }
      btnResetEl.dataset.pending='1';
      const originalLabel = btnResetEl.textContent;
      btnResetEl.textContent = '✓ Conferma';
      resetConfirmTimer = setTimeout(()=>{
        if(btnResetEl.isConnected){ btnResetEl.dataset.pending='0'; btnResetEl.textContent = originalLabel; }
      }, 3000);
    });
  }
}

function showStatus(el, type, msg){
  el.className = 'status-msg '+type;
  el.textContent = msg;
}

/* ============================================================
   TICKER — orologi mondiali + prezzo oro live
   ============================================================ */
const TICKER_CITIES = [
  { label:'New York', tz:'America/New_York' },
  { label:'Londra',   tz:'Europe/London' },
  { label:'Roma',     tz:'Europe/Rome' },
  { label:'Dubai',    tz:'Asia/Dubai' },
  { label:'Tokyo',    tz:'Asia/Tokyo' },
  { label:'Sydney',   tz:'Australia/Sydney' }
];
// Prezzo oro live e cambio USD/EUR rimossi temporaneamente: i dati in tempo
// reale non erano disponibili in modo affidabile. Verranno reintrodotti più
// avanti, a progetto concluso, con una fonte dati collegata correttamente.

function buildTickerSegmentHTML(){
  return TICKER_CITIES.map(c => `
    <span class="ticker-item">
      <span class="city">${c.label}</span>
      <span class="time" data-tz="${c.tz}">--:--:--</span>
    </span>`).join('');
}

function initTicker(){
  const track = document.getElementById('tickerTrack');
  if(!track) return;
  // due copie identiche affiancate per lo scroll continuo senza scatti
  track.innerHTML = `<span class="ticker-seg">${buildTickerSegmentHTML()}</span><span class="ticker-seg">${buildTickerSegmentHTML()}</span>`;
  updateClocks();
  setInterval(updateClocks, 1000);
  enableTickerManualScroll();
}

function enableTickerManualScroll(){
  const outer = document.querySelector('.ticker-outer');
  const track = document.getElementById('tickerTrack');
  if(!outer || !track) return;
  let dragging = false, startX = 0, startScroll = 0;

  function currentTranslateX(){
    const t = window.getComputedStyle(track).transform;
    if(!t || t==='none') return 0;
    const m = t.match(/matrix\(([^)]+)\)/);
    if(!m) return 0;
    const parts = m[1].split(',').map(v=>parseFloat(v.trim()));
    return parts[4] || 0;
  }

  outer.addEventListener('mouseenter', ()=>{
    const x = currentTranslateX();
    track.style.animation = 'none';
    track.style.transform = 'none';
    outer.classList.add('scrollable');
    outer.scrollLeft = -x;
  });

  outer.addEventListener('mouseleave', ()=>{
    dragging = false;
    outer.classList.remove('scrollable','dragging');
    outer.scrollLeft = 0;
    track.style.transform = '';
    track.style.animation = 'none';
    void track.offsetWidth; // forza il reflow per riavviare l'animazione da capo
    track.style.animation = '';
  });

  outer.addEventListener('wheel', (e)=>{
    if(!outer.classList.contains('scrollable')) return;
    outer.scrollLeft += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY);
    e.preventDefault();
  }, {passive:false});

  outer.addEventListener('mousedown', (e)=>{
    if(!outer.classList.contains('scrollable')) return;
    dragging = true;
    outer.classList.add('dragging');
    startX = e.pageX;
    startScroll = outer.scrollLeft;
  });
  window.addEventListener('mouseup', ()=>{ dragging=false; outer.classList.remove('dragging'); });
  window.addEventListener('mousemove', (e)=>{
    if(!dragging) return;
    e.preventDefault();
    outer.scrollLeft = startScroll - (e.pageX - startX);
  });
}

function updateClocks(){
  TICKER_CITIES.forEach(c=>{
    let text;
    try{
      text = new Date().toLocaleTimeString('it-IT', { timeZone:c.tz, hour:'2-digit', minute:'2-digit', second:'2-digit' });
    }catch(e){ text = '--:--:--'; }
    document.querySelectorAll(`.time[data-tz="${c.tz}"]`).forEach(el=> el.textContent = text);
  });
}

/* ============================================================
   AUTENTICAZIONE — schermata di login/registrazione, controllo
   sessione, avvio dell'app solo dopo aver verificato l'utente.
   ============================================================ */
let CURRENT_USER = null;

function showAuthScreen(){
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
}
function showMainApp(){
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
}
function showAuthStatus(id, msg){
  const el = document.getElementById(id);
  el.className = 'status-msg err';
  el.textContent = msg;
}

function setupAuthScreen(){
  const tabLogin = document.getElementById('authTabLogin');
  const tabRegister = document.getElementById('authTabRegister');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');

  tabLogin.addEventListener('click', ()=>{
    tabLogin.classList.add('active'); tabRegister.classList.remove('active');
    loginForm.style.display = 'flex'; registerForm.style.display = 'none';
  });
  tabRegister.addEventListener('click', ()=>{
    tabRegister.classList.add('active'); tabLogin.classList.remove('active');
    registerForm.style.display = 'flex'; loginForm.style.display = 'none';
  });

  loginForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    try{
      const res = await fetch('/api/login', {
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(!res.ok) return showAuthStatus('loginStatus', data.error || 'Accesso non riuscito.');
      await startApp(data);
    }catch(err){
      showAuthStatus('loginStatus', 'Impossibile contattare il server. Riprova.');
    }
  });

  registerForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const displayName = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const password2 = document.getElementById('regPassword2').value;
    if(password !== password2) return showAuthStatus('registerStatus', 'Le due password non coincidono.');
    try{
      const res = await fetch('/api/register', {
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, password, displayName })
      });
      const data = await res.json();
      if(!res.ok) return showAuthStatus('registerStatus', data.error || 'Registrazione non riuscita.');
      await startApp(data);
    }catch(err){
      showAuthStatus('registerStatus', 'Impossibile contattare il server. Riprova.');
    }
  });
}

async function logoutUser(){
  try{ await fetch('/api/logout', { method:'POST', credentials:'same-origin' }); }catch(e){}
  CURRENT_USER = null;
  // azzera lo stato in memoria così il prossimo utente non vede dati residui
  STATE.trades = []; STATE.options = []; STATE.notifLog = []; STATE.brainCheckins = []; STATE.accounts = [];
  STATE.settings = {...DEFAULT_SETTINGS};
  STATE.selectedIds = new Set(); STATE.showCards = false; STATE.currentView = 'dashboard';
  STATE.accountFilter = 'all'; STATE.showSettingsModal = false; STATE.showBrainPopup = false;
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  showAuthScreen();
}

async function startApp(user){
  CURRENT_USER = user;
  showMainApp();
  await loadAllData();
  initRevealObserver();
  render();
  initTicker();
}

async function loadAllData(){
  STATE.trades = await loadTrades();
  STATE.settings = await loadSettings();
  STATE.options = await loadOptions();
  STATE.notifLog = await loadNotifLog();
  STATE.brainCheckins = await loadCheckins();
  STATE.accounts = await loadAccounts();

  // migrazione legacy: se esistono operazioni SENZA conto assegnato (dati
  // di una versione precedente all'introduzione dei conti multipli), crea
  // un "Conto 1" e assegnale lì. Un utente nuovo che si registra sulla
  // piattaforma multi-utente non ha operazioni pregresse, quindi questo
  // blocco non scatta per lui: parte semplicemente senza conti, pronto a
  // crearne uno con "+ Aggiungi conto".
  if(STATE.accounts.length===0 && STATE.trades.some(t=>!t.accountId)){
    const firstAccount = {
      id: 'acc-1',
      name: 'Conto 1',
      startingCapital: STATE.settings.startingCapital || 500,
      transactions: [],
      paused: false,
      createdAt: new Date().toISOString()
    };
    STATE.accounts = [firstAccount];
    STATE.trades = STATE.trades.map(t => t.accountId ? t : {...t, accountId:'acc-1'});
    await saveAccounts(STATE.accounts);
    await saveTrades(STATE.trades);
  }
  // migrazione leggera: converte l'eventuale "capitalAdjustment" di una
  // versione precedente in una transazione equivalente, e garantisce che
  // ogni conto abbia sempre un array transactions
  let accountsMigrated = false;
  STATE.accounts.forEach(acc=>{
    if(!acc.transactions) acc.transactions = [];
    if(acc.capitalAdjustment){
      acc.transactions.push({
        id: 'tx-migrated-'+acc.id,
        type: acc.capitalAdjustment>=0 ? 'deposit' : 'withdrawal',
        amount: Math.round(Math.abs(acc.capitalAdjustment)*100)/100,
        date: new Date().toISOString().slice(0,10),
        note: 'Migrato dalla versione precedente'
      });
      delete acc.capitalAdjustment;
      accountsMigrated = true;
    }
  });
  if(accountsMigrated) await saveAccounts(STATE.accounts);

  STATE.accountFilter = 'all';
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  setupAuthScreen();
  window.addEventListener('scroll', hideDayCardOnScroll, {passive:true});

  // tentativo "al meglio" di chiudere la sessione anche solo chiudendo questa
  // scheda (non garantito al 100% su tutti i browser — la garanzia vera è
  // la chiusura automatica quando si chiude l'intero browser, gestita lato
  // server con il cookie di sessione senza scadenza fissa)
  window.addEventListener('pagehide', ()=>{
    if(CURRENT_USER){
      navigator.sendBeacon('/api/logout');
    }
  });

  const forceLogin = window.location.pathname === '/login' || window.location.search.includes('login');
  if(forceLogin){
    try{ await fetch('/api/logout', { method:'POST', credentials:'same-origin' }); }catch(e){}
    if(window.history && window.history.replaceState) window.history.replaceState({}, '', '/');
    showAuthScreen();
    return;
  }

  try{
    const res = await fetch('/api/me', { credentials:'same-origin' });
    const data = await res.json();
    if(data.user){
      await startApp(data.user);
    } else {
      showAuthScreen();
    }
  }catch(err){
    showAuthScreen();
    showAuthStatus('loginStatus', 'Impossibile contattare il server. Controlla la connessione.');
  }
})();
</script>
