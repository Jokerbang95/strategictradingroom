<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StrategicTradingRoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#07080D;
    --bg-panel:#12141B;
    --bg-raised:#191C25;
    --line:#242A38;
    --line-soft:#1C212C;
    --gold:#C9A868;
    --gold-bright:#F0D08E;
    --accent-cyan:#6FE0D0;
    --profit:#63C79A;
    --profit-dim:#3C6B58;
    --loss:#D46F5C;
    --loss-dim:#7A3B30;
    --text:#F5F2EC;
    --text-muted:#A3A8B4;
    --text-faint:#6E7480;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-void);color:var(--text);}
  body{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    line-height:1.6;
    letter-spacing:.005em;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    position:relative;
  }
  h1,h2,h3,.disp{font-family:'Space Grotesk', sans-serif;}
  ::selection{background:var(--gold-dim,#4a3f28);color:var(--gold-bright);}
  a{color:var(--gold);}

  /* Sfondo ambientale — l'unico movimento non innescato dall'utente:
     bagliori sfumati che derivano lentamente + una trama a griglia
     che scorre appena, per una sensazione "viva", tech, futuristica,
     senza distrarre dal contenuto */
  .ambient-glow{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;}
  .ambient-glow::before, .ambient-glow::after, .ambient-blob{content:'';position:absolute;border-radius:50%;filter:blur(110px);}
  .ambient-glow::before{
    width:680px;height:680px;top:-200px;left:-160px;
    background:radial-gradient(circle, rgba(201,168,104,.24), transparent 68%);
    animation:ambient-drift-a 24s ease-in-out infinite;
  }
  .ambient-glow::after{
    width:620px;height:620px;bottom:-180px;right:-140px;
    background:radial-gradient(circle, rgba(111,224,208,.18), transparent 68%);
    animation:ambient-drift-b 30s ease-in-out infinite;
  }
  .ambient-blob{
    width:520px;height:520px;top:32%;left:52%;
    background:radial-gradient(circle, rgba(201,168,104,.12), transparent 70%);
    animation:ambient-drift-c 38s ease-in-out infinite;
  }
  @keyframes ambient-drift-a{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(90px,60px) scale(1.12);}
  }
  @keyframes ambient-drift-b{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-75px,-50px) scale(1.08);}
  }
  @keyframes ambient-drift-c{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(50px,-35px) scale(1.1);}
  }
  .ambient-grid{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:
      linear-gradient(rgba(201,168,104,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,104,.05) 1px, transparent 1px);
    background-size:54px 54px;
    mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 90%);
    -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 90%);
    animation:ambient-grid-shift 70s linear infinite;
  }
  @keyframes ambient-grid-shift{
    from{background-position:0 0;}
    to{background-position:54px 108px;}
  }
  @media (prefers-reduced-motion: reduce){
    .ambient-glow::before, .ambient-glow::after, .ambient-blob, .ambient-grid{animation:none;}
  }

  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:18px;margin-bottom:28px;
    flex-wrap:wrap;gap:12px;
  }
  .topbar .id{color:var(--text-muted);font-size:12px;letter-spacing:.02em;}
  .topbar .id b{color:var(--text);font-weight:500;}
  .topbar-right{align-self:center;display:flex;align-items:center;gap:16px;}
  .brand-bar{
    max-width:1180px;margin:0 auto;padding:22px 24px 0;
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .brand-period{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);
    white-space:nowrap;
  }
  .brand-period b{color:var(--gold-bright);font-weight:600;}

  /* Schermata di login/registrazione */
  .auth-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;position:relative;z-index:1;
  }
  .auth-card{
    width:100%;max-width:380px;
    background:rgba(18,20,27,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:14px;padding:32px 28px;position:relative;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
  }
  .auth-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;border-radius:14px 14px 0 0;
    background:linear-gradient(90deg, transparent, rgba(240,208,142,.4), rgba(111,224,208,.22), transparent);
  }
  .auth-brand{text-align:center;margin-bottom:24px;}
  .auth-brand .brand-mark{font-size:15px;letter-spacing:.16em;}
  .auth-tabs{display:flex;gap:4px;margin-bottom:22px;background:var(--bg-raised);border-radius:9px;padding:3px;}
  .auth-tab{
    flex:1;appearance:none;background:transparent;border:none;cursor:pointer;
    font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--text-faint);
    padding:9px 0;border-radius:7px;transition:background-color .2s var(--ease),color .2s var(--ease);
  }
  .auth-tab.active{background:var(--bg-panel);color:var(--gold);}
  .auth-form{display:flex;flex-direction:column;gap:14px;}
  .auth-form .field label{font-size:11px;color:var(--text-muted);margin-bottom:5px;display:block;}
  .auth-form .field input{width:100%;padding:9px 11px;font-size:13px;}
  .auth-submit{width:100%;margin-top:4px;padding:11px 0;font-size:13.5px;}
  .user-badge{
    font-size:11px;color:var(--text-muted);display:inline-flex;align-items:center;gap:8px;
  }
  .user-badge .logout-link{color:var(--text-faint);cursor:pointer;text-decoration:underline;}
  .user-badge .logout-link:hover{color:var(--loss);}
  .brand-mark{
    display:inline-block;font-family:'Space Grotesk',sans-serif;font-size:12px;
    letter-spacing:0.16em;color:var(--text-faint);text-transform:uppercase;
    cursor:default;position:relative;padding-bottom:6px;
    transition:letter-spacing .35s cubic-bezier(.2,.8,.2,1), color .35s ease;
  }
  .brand-mark .accent{color:var(--gold);transition:color .35s ease;}
  .brand-mark::after{
    content:'';position:absolute;left:0;bottom:0;height:1px;width:0;
    background:var(--gold);transition:width .35s cubic-bezier(.2,.8,.2,1);
  }
  .brand-mark:hover{letter-spacing:0.32em;color:var(--text);}
  .brand-mark:hover .accent{color:var(--gold-bright);}
  .brand-mark:hover::after{width:100%;}

  /* Ticker: orologi + prezzo oro live */
  .ticker-outer{
    background:var(--bg-void);border-bottom:1px solid var(--line);
    overflow:hidden;white-space:nowrap;position:relative;
  }
  .ticker-outer::before,.ticker-outer::after{
    content:'';position:absolute;top:0;bottom:0;width:36px;z-index:2;pointer-events:none;
  }
  .ticker-outer::before{left:0;background:linear-gradient(90deg,var(--bg-void),transparent);}
  .ticker-outer::after{right:0;background:linear-gradient(270deg,var(--bg-void),transparent);}
  .ticker-track{
    display:inline-flex;align-items:center;
    animation:ticker-scroll 46s linear infinite;
    will-change:transform;
  }
  .ticker-outer.scrollable{overflow-x:auto;cursor:grab;scrollbar-width:none;-ms-overflow-style:none;}
  .ticker-outer.scrollable::-webkit-scrollbar{display:none;}
  .ticker-outer.dragging{cursor:grabbing;}
  @keyframes ticker-scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  .ticker-seg{display:inline-flex;align-items:center;padding:8px 0;}
  .ticker-item{
    display:inline-flex;align-items:baseline;gap:6px;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-muted);
    padding:0 18px;border-right:1px solid var(--line);
  }
  .ticker-item .city{color:var(--text-faint);font-size:10px;letter-spacing:.04em;text-transform:uppercase;}
  .ticker-item .time{color:var(--text);font-variant-numeric:tabular-nums;font-size:12px;}
  @media(max-width:700px){
    .ticker-item{padding:0 12px;font-size:10.5px;}
  }
  .acct-masked{color:var(--text-faint);opacity:0.55;letter-spacing:0.06em;user-select:none;}
  .acct-icon{cursor:pointer;font-size:12px;opacity:0.6;margin-left:2px;transition:opacity .12s;}
  .acct-icon:hover{opacity:1;}
  .acct-unlock{
    display:inline-flex;align-items:center;gap:6px;margin-left:8px;
    background:var(--bg-raised);border:1px solid var(--line);padding:4px 6px 4px 10px;
  }
  .acct-unlock input{background:transparent;border:none;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;width:80px;padding:2px 0;}
  .acct-unlock input:focus{outline:none;}
  .acct-unlock button{background:var(--gold);color:#14171C;border:none;font-size:11px;padding:4px 9px;cursor:pointer;font-weight:600;}
  .acct-unlock .err{color:var(--loss);font-size:11px;margin-left:6px;}

  /* Notifiche */
  .notif-bell-wrap{position:relative;display:inline-block;}
  .notif-bell{position:relative;}
  .notif-badge{
    position:absolute;top:-6px;right:-8px;background:var(--loss);color:#fff;
    font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
    font-family:'IBM Plex Mono',monospace;
  }
  .notif-panel{
    position:absolute;top:calc(100% + 8px);right:0;z-index:20;width:280px;
    background:var(--bg-raised);border:1px solid var(--gold);border-radius:10px;
    box-shadow:0 16px 32px -12px rgba(0,0,0,.55), 0 0 20px 0 rgba(198,161,91,.1);
    padding:12px;
    animation:notif-pop-in .2s cubic-bezier(.16,1,.3,1);
  }
  @keyframes notif-pop-in{from{opacity:0;transform:translateY(-6px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
  .notif-panel-head{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:8px;}
  .notif-item{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-top:1px solid var(--line-soft);}
  .notif-item:first-of-type{border-top:none;}
  .notif-icon{font-size:13px;flex-shrink:0;line-height:1.4;}
  .notif-main{min-width:0;flex:1;}
  .notif-tag{font-size:10px;color:var(--text-faint);}
  .notif-item.reminder .notif-tag{color:var(--gold);}
  .notif-item.release .notif-tag{color:var(--profit);}
  .notif-name{font-size:11.5px;color:var(--text);margin-top:1px;line-height:1.4;}
  .notif-item.read{opacity:.6;}
  .notif-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:5px;}
  .notif-empty{font-size:11.5px;color:var(--text-faint);padding:10px 0;text-align:center;}
  .notif-panel-foot{font-size:9.5px;color:var(--text-faint);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);line-height:1.5;}

  /* Selettore strumenti — tab dinamici con indicatore che scorre */
  .tool-nav{position:relative;display:flex;gap:4px;margin-top:8px;}
  .tool-tab{
    appearance:none;background:transparent;border:none;cursor:pointer;
    font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;
    padding:7px 14px;color:var(--text-faint);position:relative;z-index:1;
    transition:color .3s ease;border-radius:8px;
  }
  .tool-tab:hover{color:var(--text);}
  .tool-tab.active{color:var(--gold-bright);}
  .tool-nav-indicator{
    position:absolute;bottom:0;height:2px;left:0;width:0;
    background:var(--gold);border-radius:2px;
  }
  .topbar .period{font-size:12px;color:var(--text-muted);text-align:right;}
  .tool-content{}
  .tool-content.switching{animation:tool-content-in .38s cubic-bezier(.16,1,.3,1);}
  @keyframes tool-content-in{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }
  .topbar .period b{color:var(--gold);font-weight:500;}

  /* ---------- hero ---------- */
  .hero{
    display:grid;grid-template-columns:1.3fr 1fr;gap:0;
    border:1px solid var(--line);
    margin-bottom:20px;
    transition:transform .38s cubic-bezier(.16,1,.3,1), box-shadow .38s cubic-bezier(.16,1,.3,1), border-radius .38s cubic-bezier(.16,1,.3,1);
  }
  .hero:hover{
    transform:translateY(-4px);
    border-radius:10px;
    box-shadow:
      0 18px 38px -14px rgba(0,0,0,.55),
      0 0 42px 4px rgba(198,161,91,.16),
      0 0 0 1px rgba(198,161,91,.4);
  }
  .hero.paused-state{position:relative;}
  .hero.paused-state .hero-main, .hero.paused-state .hero-spark{
    filter:grayscale(.6) opacity(.35);pointer-events:none;user-select:none;
  }
  .paused-overlay{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px;gap:6px;
    background:rgba(11,13,16,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  .paused-icon{
    font-size:30px;color:var(--gold);line-height:1;margin-bottom:4px;
    animation:paused-pulse 2.2s ease-in-out infinite;
  }
  @keyframes paused-pulse{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:1;transform:scale(1.12);}}
  .paused-title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;color:var(--text);}
  .paused-sub{font-size:12px;color:var(--text-muted);max-width:420px;line-height:1.6;margin-top:2px;}
  .paused-unlock{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .paused-unlock label{font-size:11px;color:var(--text-faint);}
  .paused-unlock-note{font-size:11.5px;color:var(--text-muted);margin-bottom:2px;}
  .paused-unlock-row{display:flex;gap:8px;}
  .paused-unlock-row input{width:130px;text-align:center;}

  .acct-switcher{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .acct-switch-item{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-muted);
    background:var(--bg-raised);border:1px solid var(--line);border-radius:14px;
    padding:7px 14px;cursor:pointer;transition:border-color .18s ease,color .18s ease;
  }
  .acct-switch-item:hover{border-color:var(--gold);color:var(--text);}
  .acct-switch-item.active{border-color:var(--gold);color:var(--gold);background:rgba(198,161,91,.08);}
  .acct-switch-item.is-paused{color:var(--text-faint);}
  .acct-switch-item.is-paused.active{color:var(--gold);}
  .acct-switch-add{color:var(--gold);border-style:dashed;}
  .acct-pause-toggle{
    display:inline-block;margin-left:8px;padding:0 3px;color:var(--text-faint);
    transition:color .18s ease;cursor:pointer;
  }
  .acct-pause-toggle:hover{color:var(--gold);}
  .paused-unlock-alt{font-size:10.5px;color:var(--text-faint);margin-top:6px;}
  .paused-unlock-alt span{color:var(--gold);cursor:pointer;text-decoration:underline;}
  .paused-unlock-alt span:hover{color:var(--gold-bright);}
  .acct-add-form{
    background:var(--bg-panel);border:1px solid var(--gold);border-radius:10px;
    padding:14px 16px;margin-bottom:16px;
  }
  .hero-main{
    padding:28px 30px;border-right:1px solid var(--line);
  }
  .hero-label{font-size:12px;color:var(--text-muted);margin-bottom:8px;}
  .hero-balance{
    font-family:'Space Grotesk',sans-serif;
    font-size:52px;font-weight:600;color:var(--gold-bright);
    letter-spacing:-0.01em;line-height:1;
    text-shadow:0 0 28px rgba(240,208,142,.22);
    animation:hero-balance-glow 5s ease-in-out infinite;
  }
  @keyframes hero-balance-glow{
    0%,100%{text-shadow:0 0 22px rgba(240,208,142,.18);}
    50%{text-shadow:0 0 34px rgba(240,208,142,.32);}
  }
  @media (prefers-reduced-motion: reduce){
    .hero-balance{animation:none;}
  }
  .hero-balance sup{font-size:22px;color:var(--text-muted);font-weight:400;margin-left:4px;}
  .hero-delta{margin-top:10px;font-size:14px;}
  .hero-delta .amt{font-weight:600;}
  .hero-delta .amt.pos{color:var(--profit);}
  .hero-delta .amt.neg{color:var(--loss);}
  .hero-delta .lbl{color:var(--text-faint);margin-left:6px;}
  .hero-spark{padding:16px 20px;}
  .hero-spark-label{font-size:11px;color:var(--text-faint);margin-bottom:6px;}

  /* ---------- metric grid ---------- */
  .metrics{
    display:grid;grid-template-columns:repeat(5,1fr);
    border:1px solid var(--line);border-top:none;
    margin-bottom:20px;
  }
  .metric{
    padding:18px 20px;border-right:1px solid var(--line);
    position:relative;background:var(--bg-panel);
    transition:transform .32s cubic-bezier(.16,1,.3,1), box-shadow .32s cubic-bezier(.16,1,.3,1), border-radius .32s cubic-bezier(.16,1,.3,1), background-color .32s ease;
  }
  .metric:hover{
    transform:translateY(-4px);
    border-radius:9px;
    background:var(--bg-raised);
    box-shadow:
      0 14px 28px -12px rgba(0,0,0,.5),
      0 0 30px 2px rgba(198,161,91,.15),
      0 0 0 1px rgba(198,161,91,.35);
    z-index:2;
  }
  .metric:last-child{border-right:none;}
  .metric .m-label{font-size:11px;color:var(--text-muted);margin-bottom:6px;}
  .metric .m-value{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600;color:var(--text);}
  .metric .m-value.profit{color:var(--profit);}
  .metric .m-value.loss{color:var(--loss);}
  .metric .m-sub{font-size:11px;color:var(--text-faint);margin-top:4px;}

  /* ---------- panels ---------- */
  .panel{
    position:relative;
    border:1px solid var(--line);
    background:rgba(18,20,27,.86);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    margin-bottom:20px;
    transition:transform .35s var(--ease), box-shadow .35s var(--ease), border-radius .35s var(--ease), border-color .35s var(--ease);
  }
  .panel::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg, transparent, rgba(240,208,142,.4), rgba(111,224,208,.22), transparent);
    opacity:.7;pointer-events:none;
  }
  .panel:hover{
    transform:translateY(-4px);
    border-radius:10px;
    border-color:rgba(198,161,91,.35);
    box-shadow:
      0 16px 34px -14px rgba(0,0,0,.55),
      0 0 38px 3px rgba(198,161,91,.14),
      0 0 60px 8px rgba(111,224,208,.05),
      0 0 0 1px rgba(198,161,91,.4);
  }
  .panel-head{
    padding:14px 20px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  }
  .panel-head h2{font-size:14px;font-weight:600;margin:0;color:var(--text);}
  .panel-head .sub{font-size:11px;color:var(--text-faint);}
  .panel-body{
    padding:20px;overflow:hidden;
    max-height:4000px;opacity:1;
    transition:max-height .42s cubic-bezier(.16,1,.3,1), opacity .3s ease, padding .38s cubic-bezier(.16,1,.3,1);
  }
  .panel.collapsed .panel-body{max-height:0;opacity:0;padding-top:0;padding-bottom:0;}
  .panel.collapsed{background:var(--bg-panel);}
  .panel-head-right{display:flex;align-items:center;gap:10px;}
  .panel-collapse-btn{
    appearance:none;background:transparent;border:1px solid var(--line);color:var(--text-faint);
    width:22px;height:22px;border-radius:6px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;
    transition:transform .3s cubic-bezier(.16,1,.3,1), color .2s ease, border-color .2s ease;
  }
  .panel-collapse-btn:hover{color:var(--gold);border-color:var(--gold);}
  .panel.collapsed .panel-collapse-btn{transform:rotate(-90deg);}

  .two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start;}

  /* ---------- table ---------- */
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{
    text-align:left;padding:9px 10px;color:var(--text-muted);
    font-weight:500;border-bottom:1px solid var(--line);
    cursor:pointer;user-select:none;white-space:nowrap;font-size:11px;
  }
  thead th:hover{color:var(--gold);}
  thead th.active{color:var(--gold);}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
  tbody tr:hover{background:var(--bg-raised);}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .side-tag{
    font-size:10.5px;padding:2px 6px;border:1px solid;letter-spacing:.03em;
  }
  .side-tag.sell{color:var(--loss);border-color:var(--loss-dim);}
  .side-tag.buy{color:var(--profit);border-color:var(--profit-dim);}
  .pnl-pos{color:var(--profit);}
  .pnl-neg{color:var(--loss);}
  .row-delete{color:var(--text-faint);cursor:pointer;font-size:13px;padding:2px 6px;}
  .row-delete:hover{color:var(--loss);}

  .table-scroll{max-height:480px;overflow-y:auto;border:1px solid var(--line);}
  .table-scroll::-webkit-scrollbar{width:8px;}
  .table-scroll::-webkit-scrollbar-thumb{background:var(--line);}
  .table-scroll thead th{position:sticky;top:0;background:var(--bg-panel);z-index:1;}

  /* ---------- controls ---------- */
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  input[type=text],input[type=number],input[type=date],input[type=password],input[type=email],select,textarea{
    background:var(--bg-raised);border:1px solid var(--line);color:var(--text);border-radius:6px;
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:7px 10px;
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(198,161,91,.14), 0 0 12px 0 rgba(111,224,208,.08);
  }
  .chip{
    background:var(--bg-raised);border:1px solid var(--line);color:var(--text-muted);
    font-size:12px;padding:7px 13px;cursor:pointer;font-family:'IBM Plex Mono',monospace;
    border-radius:14px;transition:border-color .15s,color .15s;
  }
  .chip:hover{border-color:var(--gold);color:var(--text);}
  .chip.active{border-color:var(--gold);color:var(--gold);}
  .search-trigger{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-raised);border:1px solid var(--line);color:var(--text-muted);
    padding:6px 13px;cursor:pointer;border-radius:14px;font-family:'IBM Plex Mono',monospace;
    font-size:12px;transition:border-color .15s,color .15s;
  }
  .search-trigger:hover{border-color:var(--gold);color:var(--text);}
  .search-trigger.active{border-color:var(--gold);color:var(--gold);}
  .search-trigger .glass{font-size:15px;line-height:1;}
  .search-inline{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-raised);border:1px solid var(--gold);border-radius:14px;
    padding:5px 6px 5px 12px;
  }
  .search-inline .glass{font-size:15px;color:var(--gold);}
  .search-inline input{
    background:transparent;border:none;padding:2px 0;font-size:12.5px;width:130px;
  }
  .search-inline input:focus{outline:none;}
  .dow-picker-wrap{position:relative;display:inline-block;}
  .dow-picker{
    position:absolute;top:calc(100% + 6px);left:0;z-index:10;
    background:var(--bg-raised);border:1px solid var(--gold);padding:8px;
    display:flex;gap:4px;border-radius:10px;
  }
  .dow-btn{
    background:var(--bg-panel);border:1px solid var(--line);color:var(--text-muted);
    font-size:11px;font-family:'IBM Plex Mono',monospace;padding:6px 8px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;min-width:34px;
    border-radius:9px;transition:border-color .15s,color .15s;
  }
  .dow-btn .n{font-size:9px;color:var(--text-faint);}
  .dow-btn:hover{border-color:var(--gold);color:var(--text);}
  .dow-btn.active{border-color:var(--gold);color:var(--gold);background:var(--bg-void);}
  button.btn{
    background:var(--gold);color:#14171C;border:none;border-radius:7px;font-family:'Space Grotesk',sans-serif;
    font-weight:600;font-size:13px;padding:9px 18px;cursor:pointer;
    transition:background-color .2s var(--ease), transform .15s var(--ease), box-shadow .2s var(--ease);
  }
  button.btn:hover{background:var(--gold-bright);box-shadow:0 4px 16px -4px rgba(201,168,104,.45);transform:translateY(-1px);}
  button.btn:active{transform:translateY(0) scale(.97);}
  button.btn.secondary{background:transparent;color:var(--text-muted);border:1px solid var(--line);}
  button.btn.secondary:hover{color:var(--text);border-color:var(--gold);background:rgba(198,161,91,.06);box-shadow:none;}
  button.btn.danger{background:transparent;color:var(--loss);border:1px solid var(--loss-dim);}
  button.btn.danger:hover{background:var(--loss-dim);color:var(--text);box-shadow:none;}

  /* ---------- add-data panel ---------- */
  .tabs{display:flex;gap:2px;margin-bottom:16px;}
  .tab{padding:8px 16px;background:var(--bg-raised);color:var(--text-muted);font-size:12.5px;cursor:pointer;border:1px solid var(--line);border-bottom:none;border-radius:7px 7px 0 0;transition:color .18s var(--ease),background-color .18s var(--ease);}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--gold);background:var(--bg-panel);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  textarea{width:100%;min-height:140px;resize:vertical;font-size:12px;line-height:1.5;}
  .field-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;color:var(--text-muted);}
  .field input,.field select{width:100%;}
  .status-msg{font-size:12px;margin-top:10px;padding:8px 10px;border-left:2px solid;display:none;}
  .status-msg.ok{border-color:var(--profit);color:var(--profit);display:block;}
  .status-msg.err{border-color:var(--loss);color:var(--loss);display:block;}
  .hint{font-size:11px;color:var(--text-faint);margin-top:8px;line-height:1.6;}
  #dropZone.dragover{border-color:var(--gold);background:var(--bg-raised);}

  .settings-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .settings-row .field{min-width:180px;}

  footer{margin-top:30px;font-size:11px;color:var(--text-faint);text-align:center;}

  /* Schede trade */
  .select-bar{
    display:none;align-items:center;justify-content:space-between;gap:12px;
    background:var(--bg-raised);border:1px solid var(--gold);padding:10px 16px;margin-bottom:12px;
  }
  .select-bar.active{display:flex;}
  .select-bar .count{font-size:12.5px;color:var(--text);}
  .cards-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .cards-group-label{
    font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;
    margin:28px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line);
  }
  .cards-group-label.win{color:var(--profit);}
  .cards-group-label.loss{color:var(--loss);}
  .cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .tcard{
    border:1px solid var(--line);background:var(--bg-panel);display:flex;flex-direction:column;overflow:hidden;
    transition:transform .32s cubic-bezier(.16,1,.3,1), box-shadow .32s cubic-bezier(.16,1,.3,1), border-radius .32s cubic-bezier(.16,1,.3,1);
  }
  .tcard:hover{
    transform:translateY(-4px);
    border-radius:9px;
    box-shadow:
      0 14px 28px -12px rgba(0,0,0,.5),
      0 0 30px 2px rgba(198,161,91,.15),
      0 0 0 1px rgba(198,161,91,.35);
  }
  .tcard-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;}
  .tcard.win .tcard-head{border-bottom-color:var(--profit-dim);}
  .tcard.loss .tcard-head{border-bottom-color:var(--loss-dim);}
  .tcard-rank{font-size:11px;color:var(--text-faint);}
  .tcard-id{font-size:11px;color:var(--text-faint);}
  .tcard-pnl-block{padding:16px;border-bottom:1px solid var(--line);}
  .tcard-pnl{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;line-height:1;}
  .tcard.win .tcard-pnl{color:var(--profit);}
  .tcard.loss .tcard-pnl{color:var(--loss);}
  .tcard-date{font-size:12px;color:var(--text-muted);margin-top:6px;}
  .tcard-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
  .tcard-row{display:flex;justify-content:space-between;font-size:12px;}
  .tcard-row .k{color:var(--text-muted);}
  .tcard-row .v{color:var(--text);font-variant-numeric:tabular-nums;}
  .tcard-row .v.gold{color:var(--gold);}
  .tcard-pricebar{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;background:var(--bg-raised);font-size:11.5px;margin-top:2px;}
  .tcard-pricebar .p{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;}
  .tcard-notes{border-top:1px dashed var(--line);padding:12px 16px 14px;}
  .tcard-notes .nl{font-size:10px;color:var(--text-faint);text-transform:none;margin:10px 0 4px;font-weight:600;}
  .tcard-notes .nl.psych{color:var(--gold);}
  .tcard-notes ul{margin:0;padding-left:14px;display:flex;flex-direction:column;gap:5px;}
  .tcard-notes li{font-size:10.8px;line-height:1.5;color:var(--text);}
  @media(max-width:900px){ .cards-grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:620px){ .cards-grid{grid-template-columns:1fr;} }
  @media print{
    body{background:white;}
    .tcard{break-inside:avoid;}
  }

  /* ============================================================
     REVEAL-ON-SCROLL — ogni sezione appare una sola volta, la prima
     volta che entra nello schermo. Il peso dell'animazione varia in
     base all'importanza dell'informazione.
     ============================================================ */
  .reveal{
    opacity:0;transform:translateY(16px);
    transition:opacity .65s cubic-bezier(.16,1,.3,1), transform .65s cubic-bezier(.16,1,.3,1);
  }
  .reveal.in{opacity:1;transform:translateY(0);}

  /* metriche: apparizione a cascata, una dopo l'altra */
  .reveal-metrics .metric{
    opacity:0;transform:translateY(10px);
    transition:opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1);
  }
  .reveal-metrics.in .metric{opacity:1;transform:translateY(0);}
  .reveal-metrics.in .metric:nth-child(1){transition-delay:.02s;}
  .reveal-metrics.in .metric:nth-child(2){transition-delay:.09s;}
  .reveal-metrics.in .metric:nth-child(3){transition-delay:.16s;}
  .reveal-metrics.in .metric:nth-child(4){transition-delay:.23s;}
  .reveal-metrics.in .metric:nth-child(5){transition-delay:.30s;}

  /* barre dei grafici: crescono dalla linea dello zero */
  .bar-grow{
    transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0);
    transition:transform .55s cubic-bezier(.16,1,.3,1);
  }
  .bar-grow.origin-top{transform-origin:center top;}
  .bar-grow.grown{transform:scaleY(1);}
  .day-bar{transition:transform .18s ease, filter .18s ease;}

  /* locandina del giorno: si apre dall'alto della barra — leggera, bordi morbidi */
  .day-chart-wrap{overflow:visible;}
  .day-chart-scroll{
    overflow-x:auto;overflow-y:hidden;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  .day-chart-scroll::-webkit-scrollbar{height:6px;}
  .day-chart-scroll::-webkit-scrollbar-track{background:transparent;}
  .day-chart-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .day-chart-scroll::-webkit-scrollbar-thumb:hover{background:var(--gold);}
  .day-chart-scroll svg{display:block;}

  .chart-zoom-controls{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .chart-zoom-label{font-size:11px;color:var(--text-faint);margin-right:2px;}
  .chart-zoom-btn{
    appearance:none;background:var(--bg-raised);border:1px solid var(--line);color:var(--text-muted);
    width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:13px;line-height:1;
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;
    transition:border-color .18s ease,color .18s ease;
  }
  .chart-zoom-btn:hover{border-color:var(--gold);color:var(--gold);}
  .chart-zoom-btn:disabled{opacity:.35;cursor:default;}
  .chart-zoom-btn:disabled:hover{border-color:var(--line);color:var(--text-muted);}
  .chart-zoom-pct{font-size:11px;color:var(--text-faint);min-width:34px;text-align:center;font-variant-numeric:tabular-nums;}
  .chart-zoom-reset{font-size:14px;}
  .day-card{
    position:fixed;top:auto;left:0;z-index:60;
    background:rgba(27,31,38,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(198,161,91,.28);border-radius:12px;
    padding:0 13px;width:152px;
    box-shadow:0 10px 22px -12px rgba(0,0,0,.4), 0 0 14px 0 rgba(198,161,91,.08);
    opacity:0;max-height:0;overflow:hidden;pointer-events:none;
    transform:scale(0.92);transform-origin:bottom center;
    transition:opacity .2s cubic-bezier(.16,1,.3,1), max-height .26s cubic-bezier(.16,1,.3,1), transform .22s cubic-bezier(.16,1,.3,1), padding .22s ease;
  }
  .day-card.open{
    opacity:1;max-height:220px;padding:11px 13px 12px;
    transform:scale(1);
  }
  .day-card-date{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:500;color:var(--text-muted);white-space:nowrap;}
  .day-card-pnl{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin-top:2px;}
  .day-card-pnl.pos{color:var(--profit);}
  .day-card-pnl.neg{color:var(--loss);}
  .day-card-sub{font-size:10px;color:var(--text-faint);margin-top:2px;white-space:nowrap;}
  .day-card-dots{display:flex;flex-wrap:wrap;gap:3.5px;margin-top:8px;max-width:134px;}
  .day-dot{width:6.5px;height:6.5px;border-radius:50%;display:inline-block;cursor:default;opacity:.9;}
  .day-dot.win{background:var(--profit);box-shadow:0 0 3px rgba(95,169,137,.6);}
  .day-dot.loss{background:var(--loss);box-shadow:0 0 3px rgba(193,92,74,.6);}

  /* righe del pannello Dettagli: si distinguono al passaggio del mouse */
  .detail-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 10px;margin:0 -10px;border-radius:8px;
    transition:background-color .2s ease, transform .2s ease;
  }
  .detail-row:hover{background:var(--bg-raised);transform:translateX(3px);}
  .detail-row .v{display:inline-block;transition:transform .2s cubic-bezier(.16,1,.3,1);}
  .detail-row:hover .v{transform:scale(1.08);}
  .detail-row-clickable{cursor:pointer;}
  .detail-row-clickable:hover{background:rgba(198,161,91,.10);}
  .detail-row-clickable .chev{display:inline-block;font-size:9px;color:var(--text-faint);margin-left:7px;transition:transform .25s ease;}
  .detail-row-clickable.expanded .chev{transform:rotate(90deg);color:var(--gold);}

  .detail-expand{
    max-height:0;opacity:0;overflow:hidden;margin:0 -10px;
    transition:max-height .32s cubic-bezier(.16,1,.3,1), opacity .26s ease, margin .32s ease;
  }
  .detail-expand.open{max-height:170px;opacity:1;margin:3px -10px 6px;}
  .detail-expand-inner{
    background:var(--bg-raised);border:1px solid var(--line);border-radius:9px;
    padding:11px 13px;display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;
  }
  .detail-expand-inner .k{color:var(--text-faint);font-size:10px;display:block;margin-bottom:2px;}
  .detail-expand-inner .val{color:var(--text);font-size:12.5px;font-variant-numeric:tabular-nums;}
  .detail-expand-inner .val.gold{color:var(--gold);font-weight:600;}

  /* Calendario economico USA */
  .econ-list{display:flex;flex-direction:column;gap:1px;background:var(--line);}
  .econ-row{
    display:grid;grid-template-columns:118px 1fr auto;gap:14px;align-items:center;
    background:var(--bg-panel);padding:12px 14px;transition:background-color .2s ease, transform .2s ease;
  }
  .econ-row:hover{background:var(--bg-raised);transform:translateX(3px);}
  .econ-row.past{opacity:.45;}
  .econ-row.next{background:rgba(198,161,91,.07);border-left:2px solid var(--gold);}
  .econ-when{display:flex;flex-direction:column;gap:1px;}
  .econ-date{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:var(--text);}
  .econ-time{font-size:10.5px;color:var(--text-faint);}
  .econ-main{min-width:0;}
  .econ-name{font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .econ-next-tag{font-size:9px;color:var(--gold);border:1px solid var(--gold);padding:1px 6px;letter-spacing:.04em;text-transform:uppercase;border-radius:8px;}
  .econ-period{font-size:10.5px;color:var(--text-faint);margin-top:2px;}
  .econ-impact{font-size:11px;color:var(--text-muted);margin-top:5px;line-height:1.5;max-width:520px;}
  .econ-badge{
    font-size:10px;padding:3px 9px;border-radius:9px;letter-spacing:.03em;text-transform:uppercase;
    white-space:nowrap;font-weight:600;
  }
  .econ-badge.high{background:rgba(193,92,74,.15);color:var(--loss);border:1px solid rgba(193,92,74,.4);}
  .econ-badge.medium{background:rgba(198,161,91,.15);color:var(--gold);border:1px solid rgba(198,161,91,.4);}
  .econ-badge.low{background:rgba(139,143,152,.12);color:var(--text-faint);border:1px solid var(--line);}
  .econ-badge.holiday{background:rgba(198,161,91,.12);color:var(--gold);border:1px solid rgba(198,161,91,.4);}
  .econ-legend{
    display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;padding-bottom:12px;
    border-bottom:1px solid var(--line);font-size:11px;color:var(--text-faint);
  }
  .econ-legend span{display:inline-flex;align-items:center;gap:5px;}

  /* Analisi macro */
  .macro-section-label{
    font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--gold);
    margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);
  }
  .macro-section-label:first-child{margin-top:0;}
  .macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);}
  .macro-card{background:var(--bg-panel);padding:14px 16px;transition:background-color .2s ease;}
  .macro-card:hover{background:var(--bg-raised);}
  .macro-card-label{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .macro-card-value{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;color:var(--text);margin-top:4px;}
  .macro-card-period{font-size:10.5px;color:var(--text-faint);margin-top:2px;}
  .macro-card-detail{font-size:11px;color:var(--text-muted);margin-top:7px;line-height:1.5;}
  .macro-tag{font-size:9px;padding:1px 6px;border-radius:8px;text-transform:uppercase;letter-spacing:.03em;}
  .macro-tag.beat{background:rgba(95,169,137,.15);color:var(--profit);}
  .macro-tag.miss{background:rgba(193,92,74,.15);color:var(--loss);}
  .macro-tag.inline{background:rgba(139,143,152,.12);color:var(--text-faint);}

  .rate-expect{margin-top:18px;background:var(--bg-panel);border:1px solid var(--line);padding:14px 16px;}
  .rate-expect-label{font-size:12px;color:var(--text-muted);margin-bottom:10px;}
  .rate-expect-bar{display:flex;height:26px;overflow:hidden;border-radius:4px;}
  .rate-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#0B0D10;font-family:'IBM Plex Mono',monospace;}
  .rate-seg.hike{background:var(--loss);}
  .rate-seg.hold{background:var(--gold);}
  .rate-seg.cut{background:var(--profit);}
  .rate-expect-legend{display:flex;gap:16px;margin-top:9px;font-size:11px;color:var(--text-muted);}
  .rate-expect-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
  .rate-expect-legend .dot.hike{background:var(--loss);}
  .rate-expect-legend .dot.hold{background:var(--gold);}
  .rate-expect-legend .dot.cut{background:var(--profit);}

  .geo-list{display:flex;flex-direction:column;gap:1px;background:var(--line);}
  .geo-item{background:var(--bg-panel);padding:12px 16px;transition:background-color .2s ease;}
  .geo-item:hover{background:var(--bg-raised);}
  .geo-title{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:var(--text);}
  .geo-detail{font-size:11.5px;color:var(--text-muted);margin-top:5px;line-height:1.6;}

  .inst-block{background:var(--bg-panel);border:1px solid var(--line);padding:14px 16px;}
  .target-list{margin:12px 0;border:1px solid var(--line);}
  .target-row{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:12px;}
  .target-row:last-child{border-bottom:none;}
  .target-bank{color:var(--text-muted);}
  .target-value{color:var(--gold);font-weight:600;font-family:'IBM Plex Mono',monospace;}

  .macro-summary{background:var(--bg-panel);border:1px solid var(--line);padding:16px 18px;}
  .macro-summary p{font-size:12.5px;line-height:1.7;color:var(--text);margin:0 0 12px;}
  .macro-summary p:last-child{margin-bottom:0;}

  /* 🧠 Analisi ultima giornata / ultima settimana */
  .brain-cols{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);}
  .brain-block{background:var(--bg-panel);padding:16px 18px;}
  .brain-block-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--gold);margin-bottom:6px;}
  .brain-block-pnl{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;margin-bottom:10px;}
  .brain-block-pnl.pos{color:var(--profit);}
  .brain-block-pnl.neg{color:var(--loss);}
  .brain-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:9px;}
  .brain-list li{font-size:12px;line-height:1.6;color:var(--text);}

  /* Icona 🧠 fluttuante e pop-up — solo l'emoji, senza contenitore */
  .brain-fab{
    position:fixed;bottom:26px;right:28px;z-index:90;
    font-size:46px;line-height:1;cursor:pointer;user-select:none;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.5)) drop-shadow(0 0 0 rgba(198,161,91,0));
    transition:transform .2s cubic-bezier(.16,1,.3,1);
    animation:brain-fab-pulse 2.8s ease-in-out infinite;
  }
  .brain-fab:hover{transform:scale(1.1);}
  @keyframes brain-fab-pulse{
    0%,100%{filter:drop-shadow(0 6px 14px rgba(0,0,0,.5)) drop-shadow(0 0 6px rgba(198,161,91,.35));}
    50%{filter:drop-shadow(0 6px 14px rgba(0,0,0,.5)) drop-shadow(0 0 16px rgba(198,161,91,.75));}
  }
  .brain-popup{
    position:fixed;bottom:96px;right:24px;z-index:95;
    width:420px;max-width:calc(100vw - 32px);max-height:72vh;
    display:flex;flex-direction:column;
    background:var(--bg-panel);border:1px solid var(--gold);border-radius:12px;
    box-shadow:0 26px 60px -16px rgba(0,0,0,.6);
    animation:brain-popup-in .22s cubic-bezier(.16,1,.3,1);
  }
  @keyframes brain-popup-in{from{opacity:0;transform:translateY(14px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}
  .brain-popup-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .brain-popup-title{font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:600;color:var(--text);}
  .brain-popup-close{cursor:pointer;color:var(--text-faint);font-size:14px;padding:2px 6px;transition:color .15s ease;}
  .brain-popup-close:hover{color:var(--loss);}
  .brain-popup-tabs{display:flex;gap:2px;padding:10px 16px 0;flex-shrink:0;border-bottom:1px solid var(--line);}
  .brain-popup-tab{
    font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;color:var(--text-faint);
    padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s ease,border-color .15s ease;
  }
  .brain-popup-tab:hover{color:var(--text);}
  .brain-popup-tab.active{color:var(--gold);border-color:var(--gold);}
  .brain-popup-body{padding:16px;overflow-y:auto;}

  /* Check-in a chat guidata */
  .brain-chat{display:flex;flex-direction:column;gap:10px;}
  .brain-chat-messages{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding-right:2px;}
  .brain-chat-bubble{
    max-width:88%;padding:9px 12px;border-radius:12px;font-size:12px;line-height:1.55;
    animation:brain-bubble-in .18s ease;
  }
  @keyframes brain-bubble-in{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .brain-chat-bubble.bot{align-self:flex-start;background:var(--bg-raised);border:1px solid var(--line);color:var(--text);border-bottom-left-radius:3px;}
  .brain-chat-bubble.user{align-self:flex-end;background:rgba(198,161,91,.14);border:1px solid rgba(198,161,91,.35);color:var(--text);border-bottom-right-radius:3px;}
  .brain-chat-options{display:flex;flex-direction:column;gap:6px;padding-top:4px;border-top:1px solid var(--line);}
  .brain-chat-option{
    appearance:none;text-align:left;background:var(--bg-raised);border:1px solid var(--line);color:var(--text);
    padding:8px 12px;border-radius:8px;font-size:11.5px;cursor:pointer;font-family:inherit;
    transition:border-color .15s ease,background-color .15s ease;
  }
  .brain-chat-option:hover{border-color:var(--gold);background:rgba(198,161,91,.08);}
  .brain-chat-restart{align-self:flex-start;color:var(--gold);}

  /* Storico check-in: classifica emozioni + registro */
  .brain-tally{display:flex;flex-direction:column;gap:8px;}
  .brain-tally-row{display:grid;grid-template-columns:1fr 2fr auto;align-items:center;gap:10px;}
  .brain-tally-label{font-size:11.5px;color:var(--text);}
  .brain-tally-bar-wrap{height:7px;background:var(--bg-raised);border-radius:4px;overflow:hidden;}
  .brain-tally-bar{height:100%;background:var(--gold);border-radius:4px;transition:width .3s ease;}
  .brain-tally-count{font-size:10.5px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .brain-history-log{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);max-height:180px;overflow-y:auto;}
  .brain-history-row{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--bg-panel);font-size:11px;}
  .brain-history-date{color:var(--text-faint);min-width:64px;}
  .brain-history-pnl{font-family:'IBM Plex Mono',monospace;font-weight:600;min-width:70px;}
  .brain-history-pnl.pos{color:var(--profit);}
  .brain-history-pnl.neg{color:var(--loss);}
  .brain-history-emotion{color:var(--text-muted);}
  .brain-popup-body .brain-cols{grid-template-columns:1fr;}
  .brain-intro{font-size:12.5px;color:var(--text-muted);line-height:1.6;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .brain-subtitle{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-top:12px;margin-bottom:6px;}
  .brain-subtitle-rec{color:var(--profit);}
  .brain-list-rec li{color:var(--text-muted);}
  @media(max-width:480px){
    .brain-fab{bottom:18px;right:18px;font-size:38px;}
    .brain-popup{bottom:82px;right:16px;left:16px;width:auto;}
  }
  @media(max-width:700px){
    .brain-cols{grid-template-columns:1fr;}
  }

  /* Tracker opzioni */
  .opt-weeks{display:flex;flex-direction:column;gap:16px;}
  .opt-week{border:1px solid var(--line);}
  .opt-week-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;background:var(--bg-raised);border-bottom:1px solid var(--line);}
  .opt-week-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--gold);}
  .opt-week-range{font-size:11px;color:var(--text-faint);}
  .opt-empty{padding:16px;font-size:12px;color:var(--text-faint);text-align:center;}
  .opt-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line-soft);}
  .opt-row:last-child{border-bottom:none;}
  .opt-row:hover{background:var(--bg-raised);}
  .opt-type{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.03em;flex-shrink:0;}
  .opt-type.call{background:rgba(95,169,137,.15);color:var(--profit);}
  .opt-type.put{background:rgba(193,92,74,.15);color:var(--loss);}
  .opt-main{flex:1;min-width:0;}
  .opt-strike{font-size:12.5px;color:var(--text);font-family:'IBM Plex Mono',monospace;}
  .opt-sub{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .opt-days{color:var(--gold);}
  .opt-delete{color:var(--text-faint);cursor:pointer;font-size:13px;padding:2px 6px;flex-shrink:0;}
  .opt-delete:hover{color:var(--loss);}

  /* Fondi depositati/prelevati per conto */

    display:flex;align-items:center;gap:12px;padding:9px 14px;
    border-bottom:1px solid var(--line-soft);font-size:12px;
  }
  .tx-row:last-child{border-bottom:none;}
  .tx-row:hover{background:var(--bg-raised);}

    font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.02em;flex-shrink:0;

  .tx-type.withdrawal{background:rgba(193,92,74,.15);color:var(--loss);}

  .tx-amount.pos{color:var(--profit);}
  .tx-amount.neg{color:var(--loss);}
  .tx-date{color:var(--text-faint);font-size:11px;min-width:70px;}
  .tx-note{color:var(--text-muted);flex:1;font-size:11.5px;}
  .tx-edit, .tx-delete{color:var(--text-faint);cursor:pointer;padding:2px 5px;flex-shrink:0;}
  .tx-edit:hover{color:var(--gold);}
  .tx-delete:hover{color:var(--loss);}
  .tx-account{color:var(--gold);font-size:11px;min-width:80px;}

  /* Modale impostazioni */
  .settings-modal-overlay{
    position:fixed;inset:0;z-index:100;
    background:rgba(6,7,9,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:modal-fade-in .18s ease;
  }
  @keyframes modal-fade-in{from{opacity:0;}to{opacity:1;}}
  .settings-modal{
    width:100%;max-width:720px;max-height:85vh;display:flex;flex-direction:column;
    background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.65);
    animation:modal-pop-in .22s cubic-bezier(.16,1,.3,1);
  }
  @keyframes modal-pop-in{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .settings-modal-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 22px;border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .settings-modal-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:var(--text);}
  .settings-modal-close{cursor:pointer;color:var(--text-faint);font-size:15px;padding:4px 8px;transition:color .15s ease;}
  .settings-modal-close:hover{color:var(--loss);}
  .settings-modal-tabs{display:flex;gap:4px;padding:14px 22px 0;flex-shrink:0;}
  .settings-modal-tab{
    font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:var(--text-faint);
    padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s ease,border-color .15s ease;
  }
  .settings-modal-tab:hover{color:var(--text);}
  .settings-modal-tab.active{color:var(--gold);border-color:var(--gold);}
  .settings-modal-body{padding:20px 22px 24px;overflow-y:auto;}

  .settings-acct-info{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .settings-acct-name{font-size:13px;color:var(--text);font-weight:500;}
  .settings-acct-paused{color:var(--gold);font-size:11px;font-weight:400;}

     frame-per-frame (nessuna CSS transition qui, per restare sincronizzate
     con la cometa e l'etichetta che mostra il saldo istante per istante) */
  #eqEndDot{transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
  #eqEndDot.shown{transform:scale(1);}
  #eqComet{filter:drop-shadow(0 0 4px rgba(228,200,136,.9)) drop-shadow(0 0 9px rgba(198,161,91,.55));}
  #eqTravelLabel{paint-order:stroke;stroke:#0B0D10;stroke-width:3px;stroke-linejoin:round;}
  #eqPulseRing{opacity:0;transform-box:fill-box;transform-origin:center;}
  #eqPulseRing.firing{animation:eq-pulse-ring .85s cubic-bezier(.16,1,.3,1) forwards;}
  @keyframes eq-pulse-ring{
    0%{opacity:.85;transform:scale(.4);}
    100%{opacity:0;transform:scale(3.4);}
  }
  .eq-chart-wrap{transition:box-shadow 1.5s ease;}
  .eq-chart-wrap.journeying{box-shadow:0 0 44px 2px rgba(198,161,91,.10);}

  .hero-balance-num{display:inline-block;}

  @media (prefers-reduced-motion: reduce){
    .reveal,.reveal-metrics .metric,.bar-grow,#eqLine,#eqEndDot,#eqComet,#eqTravelLabel,#eqPulseRing{
      opacity:1 !important;transform:none !important;transition:none !important;animation:none !important;stroke-dashoffset:0 !important;
    }
  }


  @media(max-width:800px){
    .metrics{grid-template-columns:repeat(2,1fr);}
    .metric:nth-child(2n){border-right:none;}
    .metric:nth-child(n+3){border-top:1px solid var(--line);}
    .hero{grid-template-columns:1fr;}
    .hero-main{border-right:none;border-bottom:1px solid var(--line);}
    .two-col{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr 1fr;}
    .hero-balance{font-size:38px;}
  }
  @media(min-width:801px) and (max-width:1000px){
    .metrics{grid-template-columns:repeat(3,1fr);}
    .metric:nth-child(3n){border-right:none;}
    .metric:nth-child(n+4){border-top:1px solid var(--line);}
  }
</style>

/* ============================================================
   PARSING — incolla nuovo rendiconto broker (stesso formato)
   ============================================================ */
function toISODate(d){ // dd/mm/yyyy -> yyyy-mm-dd
  const m = d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return d;
  return `${m[3]}-${m[2]}-${m[1]}`;
}
function to24h(t){ // "06:48:22 PM" -> "18:48:22"
  const m = t.match(/^(\d{1,2}):(\d{2}):(\d{2})\s*(AM|PM)$/i);
  if(!m) return t;
  let h = parseInt(m[1],10);
  const ap = m[4].toUpperCase();
  if(ap==='PM' && h!==12) h+=12;
  if(ap==='AM' && h===12) h=0;
  return `${String(h).padStart(2,'0')}:${m[2]}:${m[3]}`;
}
// Formula di stima usata SOLO quando il broker non fornisce una colonna "Profit" reale
// (es. incolla da un PDF senza quella colonna, o inserimento manuale).
// Calibrata sui dati reali del conto: per una Sell, il broker registra profitto
// quando Close > Open con questo dataset — usa questa convenzione come stima.
function calcPnl(side, volume, openPrice, closePrice, commission, mult){
  const raw = side==='Sell' ? (closePrice-openPrice) : (openPrice-closePrice);
  return Math.round((raw*volume*mult - (commission||0))*100)/100;
}

function parseBrokerText(text, mult){
  const tokens = text.split(/\s+/).filter(Boolean);
  const trades = [];
  let i=0;
  while(i < tokens.length){
    if(/^\d{5,}$/.test(tokens[i]) && tokens[i+1] && /^\d{2}\/\d{2}\/\d{4}$/.test(tokens[i+1])){
      const chunk = tokens.slice(i, i+15);
      if(chunk.length===15){
        const [id, od, ot1, ot2, cd, ct1, ct2, acct, side, ccy, sym, vol, op, cp, comm] = chunk;
        const volume=parseFloat(vol), openPrice=parseFloat(op), closePrice=parseFloat(cp), commission=parseFloat(comm);
        if((side==='Buy'||side==='Sell') && !isNaN(volume) && !isNaN(openPrice) && !isNaN(closePrice)){
          trades.push({
            id, openDate:toISODate(od), openTime:to24h(ot1+' '+ot2),
            closeDate:toISODate(cd), closeTime:to24h(ct1+' '+ct2),
            side, symbol:sym, volume, openPrice, closePrice,
            commission:isNaN(commission)?0:commission,
            pnl: calcPnl(side, volume, openPrice, closePrice, isNaN(commission)?0:commission, mult),
            estimated: true
          });
          i+=15; continue;
        }
      }
    }
    i++;
  }
  return trades;
}

function parseCSVLine(line){
  // gestisce campi tra virgolette con eventuali virgole interne
  const out = []; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(c==='"'){ inQ=!inQ; continue; }
    if(c===',' && !inQ){ out.push(cur); cur=''; continue; }
    cur+=c;
  }
  out.push(cur);
  return out.map(s=>s.trim());
}

function parseCSV(text, mult){
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return [];
  const headers = parseCSVLine(lines[0]).map(h=>h.trim().toLowerCase());
  const find = (...names) => headers.findIndex(h => names.some(n=>h.includes(n)));
  const idxId = find('id'), idxOD = find('open time','open date','opentime'),
        idxCD = find('close time','close date','closetime'),
        idxSide = find('buy','side','type'),
        idxSym = find('symbol','stock','pair'),
        idxVol = find('volume','lot','size'),
        idxOP = find('open price','openprice'),
        idxCP = find('close price','closeprice'),
        idxComm = find('commission'),
        idxSwap = find('swap'),
        idxProfit = find('profit');
  const trades=[];
  for(let li=1; li<lines.length; li++){
    const cols = parseCSVLine(lines[li]);
    if(cols.length < 3) continue;
    const rawOpen = idxOD>=0 ? cols[idxOD] : '';
    const rawClose = idxCD>=0 ? cols[idxCD] : '';
    const side = idxSide>=0 ? (/buy/i.test(cols[idxSide])?'Buy':'Sell') : 'Sell';
    const volume = idxVol>=0 ? parseFloat(cols[idxVol]) : NaN;
    const openPrice = idxOP>=0 ? parseFloat(cols[idxOP]) : NaN;
    const closePrice = idxCP>=0 ? parseFloat(cols[idxCP]) : NaN;
    const commission = idxComm>=0 ? parseFloat(cols[idxComm]) : 0;
    const swap = idxSwap>=0 ? parseFloat(cols[idxSwap]) : 0;
    const reportedProfit = idxProfit>=0 ? parseFloat(cols[idxProfit]) : NaN;
    if(isNaN(volume)||isNaN(openPrice)||isNaN(closePrice)) continue;
    const [od, ot] = splitDT(rawOpen);
    const [cd, ct] = splitDT(rawClose);
    const hasRealProfit = !isNaN(reportedProfit);
    const pnl = hasRealProfit
      ? Math.round((reportedProfit + (isNaN(swap)?0:swap) - (isNaN(commission)?0:commission))*100)/100
      : calcPnl(side, volume, openPrice, closePrice, isNaN(commission)?0:commission, mult);
    trades.push({
      id: idxId>=0 ? cols[idxId] : ('m'+li+Date.now()),
      openDate: od, openTime: ot, closeDate: cd, closeTime: ct,
      side, symbol: idxSym>=0?cols[idxSym]:'XAUUSD', volume, openPrice, closePrice,
      commission: isNaN(commission)?0:commission,
      swap: isNaN(swap)?0:swap,
      pnl, estimated: !hasRealProfit
    });
  }
  return trades;
}
function splitDT(raw){
  if(!raw) return ['',''];
  const parts = raw.split(/[ T]/);
  let d = parts[0] || '';
  let t = parts.slice(1).join(' ') || '00:00:00';
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(d)) d = toISODate(d);
  if(/AM|PM/i.test(t)) t = to24h(t.trim());
  return [d, t];
}

/* ============================================================
   WEEKLY BREAKDOWN — raggruppa per settimana (lunedì-domenica)
   e confronta automaticamente la settimana migliore con la peggiore
   ============================================================ */
function mondayOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = (day===0?-6:1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function addDaysISO(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function holdMinutes(t){
  const o = new Date(`${t.openDate}T${t.openTime||'00:00:00'}`);
  const c = new Date(`${t.closeDate}T${t.closeTime||'00:00:00'}`);
  return (c-o)/60000;
}

function calcPips(t){
  // convenzione standard broker: per l'oro (XAUUSD) 1 pip = 0.01; per il forex a 4 decimali 1 pip = 0.0001
  const pipSize = (t.symbol||'').toUpperCase()==='XAUUSD' ? 0.01 : 0.0001;
  return Math.abs(t.closePrice - t.openPrice) / pipSize;
}

/* ============================================================
   NOTIFICHE — storico persistente. Confrontano l'orologio reale
   con gli eventi del calendario economico e generano al massimo
   una notifica "promemoria" (il giorno prima/lo stesso giorno) e
   una "rilascio" (a evento avvenuto) per ciascun evento. Una volta
   generate restano nello storico per sempre — aprire la campanella
   segna tutto come letto ma NON cancella nulla: le notifiche già
   viste restano visibili ad ogni apertura successiva.
   Non sono notifiche push del sistema operativo: si aggiornano
   quando la piattaforma è aperta.
   ============================================================ */
function etDateStr(d){
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(d);
  const y = parts.find(p=>p.type==='year').value;
  const mo = parts.find(p=>p.type==='month').value;
  const da = parts.find(p=>p.type==='day').value;
  return `${y}-${mo}-${da}`;
}

function syncNotifications(){
  const now = new Date();
  const todayET = etDateStr(now);
  const tomorrowET = addDaysISO(todayET, 1);
  const existingIds = new Set(STATE.notifLog.map(n=>n.id));
  let changed = false;

  ECON_CALENDAR_USA.forEach(e=>{
    const d = new Date(e.iso);
    const eDateET = etDateStr(d);
    const inReminderWindow = (eDateET===tomorrowET) || (eDateET===todayET && d>now);

    if(inReminderWindow){
      const rid = e.iso+'-reminder';
      if(!existingIds.has(rid)){
        STATE.notifLog.push({ id:rid, kind:'reminder', name:e.name, when:e.iso, generatedAt:now.toISOString(), read:false });
        existingIds.add(rid); changed = true;
      }
    }
    if(d <= now){
      const rid = e.iso+'-release';
      if(!existingIds.has(rid)){
        STATE.notifLog.push({ id:rid, kind:'release', name:e.name, when:e.iso, generatedAt:now.toISOString(), read:false });
        existingIds.add(rid); changed = true;
      }
    }
  });

  if(changed){
    STATE.notifLog.sort((a,b)=> new Date(b.generatedAt) - new Date(a.generatedAt));
    saveNotifLog(STATE.notifLog);
  }
  return changed;
}

function renderNotifItem(n){
  const d = new Date(n.when);
  const timeLabel = d.toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit', timeZone:'America/New_York' });
  const dateLabel = d.toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit', timeZone:'America/New_York' });
  const ICONS = { reminder:'🔔', release:'✅' };

      <div class="notif-name">${n.name}</div>
    </div>
    ${!n.read?'<span class="notif-dot"></span>':''}
  </div>`;
}

function renderNotifPanel(){
  const items = [...STATE.notifLog].sort((a,b)=> new Date(b.generatedAt) - new Date(a.generatedAt));
  return `<div class="notif-panel">
    <div class="notif-panel-head">Notifiche</div>
    ${items.length ? items.map(renderNotifItem).join('') : '<div class="notif-empty">Nessuna notifica ricevuta finora.</div>'}
    <div class="notif-panel-foot">Calcolate dal calendario economico USA — non sono notifiche push, si aggiornano quando apri la piattaforma. Restano nello storico anche dopo averle lette.</div>
  </div>`;
}

function computeBrainContext(activeTrades, weeklyStats, activeCapital){
  const avg = accountWideAverages(activeTrades);
  const sortedAll = [...activeTrades].sort((a,b)=>dt(a)-dt(b));

  const allDays = computeAllDaysStats(activeTrades, activeCapital);
  const lastDayStats = allDays[allDays.length-1];
  const bestDay = findBestByPnl(allDays);

  const weeksWithTrades = weeklyStats.filter(w=>w.trades>0);
  const lastWeekEntry = weeksWithTrades[weeksWithTrades.length-1];
  const lastWeekStats = lastWeekEntry ? analyzePeriod(lastWeekEntry.list, `${fmtDateIT(lastWeekEntry.weekStart)} – ${fmtDateIT(lastWeekEntry.weekEnd)}`, sortedAll, activeCapital) : null;
  const allWeeksStats = weeksWithTrades.map(w => analyzePeriod(w.list, `${fmtDateIT(w.weekStart)} – ${fmtDateIT(w.weekEnd)}`, sortedAll, activeCapital));
  const bestWeek = findBestByPnl(allWeeksStats);

  return { avg, lastDayStats, lastWeekStats, bestDay, bestWeek };
}

function renderBrainPanel(ctx){
  const { avg, lastDayStats, lastWeekStats, bestDay, bestWeek } = ctx;
  const feedback = generateBrainFeedback(lastDayStats, lastWeekStats, avg, bestDay, bestWeek);

  const dayIsWorst = lastDayStats.pnl < 0;
  const weekIsWorst = lastWeekStats && lastWeekStats.pnl < 0;
  const intro = (dayIsWorst || weekIsWorst)
    ? `Guardiamo insieme cosa dicono i numeri dell'ultimo periodo, confrontandoli con i tuoi momenti migliori — non per giudicare, ma per capire cosa è cambiato davvero.`
    : `L'ultimo periodo è positivo. Vale comunque la pena confrontarlo con i tuoi momenti migliori, per capire cosa sta funzionando e provare a ripeterlo.`;

  function renderBlock(title, stat, bullets, compare, recs){
    return `
      <div class="brain-block">
        <div class="brain-block-title">${title}</div>
        <div class="brain-block-pnl ${stat.pnl>=0?'pos':'neg'}">${fmtMoney(stat.pnl,true)}</div>
        ${bullets.length ? `<ul class="brain-list">${bullets.map(b=>`<li>${b}</li>`).join('')}</ul>` : `<div class="hint" style="margin-top:8px;">Nessun pattern particolare rispetto alla media del conto.</div>`}
        ${compare.length ? `
          <div class="brain-subtitle">Rispetto al tuo momento migliore</div>
          <ul class="brain-list">${compare.map(b=>`<li>${b}</li>`).join('')}</ul>
        ` : ''}
        ${recs.length ? `
          <div class="brain-subtitle brain-subtitle-rec">Cosa provare</div>
          <ul class="brain-list brain-list-rec">${recs.map(b=>`<li>${b}</li>`).join('')}</ul>
        ` : ''}
      </div>`;
  }

  return `
    <div class="brain-intro">${intro}</div>
    <div class="brain-cols">
      ${renderBlock(`Ultima giornata — ${fmtDateIT(lastDayStats.label)}`, lastDayStats, feedback.dayBullets, feedback.dayCompare, feedback.dayRecs)}
      ${lastWeekStats ? renderBlock(`Ultima settimana — ${lastWeekStats.label}`, lastWeekStats, feedback.weekBullets, feedback.weekCompare, feedback.weekRecs) : ''}
    </div>
    <div class="hint" style="margin-top:14px;">Questi sono pattern osservati nei dati, confrontati con la tua stessa storia su questo conto — non una diagnosi. Solo tu puoi confermare se corrispondono davvero a cosa è successo.</div>
  `;
}

/* ============================================================
   💬 CHECK-IN EMOTIVO — non è un'IA a testo libero (questo file
   non è collegato a nessun modello linguistico): è un percorso
   guidato a scelte, dove il bot collega la risposta scelta ai
   pattern REALI già rilevati nei dati dell'ultimo periodo, invece
   di dare risposte generiche.
   ============================================================ */
const BRAIN_EMOTION_OPTIONS = [
  { id:'tired',      label:'Stanco/a o poco lucido/a' },
  { id:'frustrated', label:'Frustrato/a da una perdita precedente' },
  { id:'pressure',   label:'Sotto pressione per altro (lavoro, vita privata)' },
  { id:'overconf',   label:'Molto sicuro/a dopo una serie di vincite' },
  { id:'anxious',    label:'In ansia per il mercato o per una notizia' },
  { id:'unsure',     label:'Non saprei dire con precisione' }
];
const BRAIN_COPING_OPTIONS = [
  { id:'pause',    label:'Una pausa fissa dopo ogni perdita (15-30 min)' },
  { id:'journal',  label:'Scrivere cosa provo prima di aprire un trade' },
  { id:'limit',    label:'Un limite giornaliero di operazioni o di perdita' },
  { id:'stop',     label:'Chiudere la piattaforma dopo un certo punto' },
  { id:'unsure2',  label:'Non sono sicuro/a, ci devo pensare' }
];

function brainEmotionReflection(emotionId, stat){
  const hasRevenge = stat && stat.revenge>0;
  const hasBigSize = stat && stat.avgVolume>0; // il confronto con la media viene fatto a monte
  const hasBigLoss = stat && stat.worstShare>=50;
  switch(emotionId){
    case 'tired':
      return hasRevenge
        ? `Ha senso: la stanchezza riduce la pazienza nelle decisioni. E infatti i dati mostrano ${stat.revenge} rientr${stat.revenge===1?'o rapido':'i rapidi'} dopo una perdita — un classico segnale di scelte prese di fretta più che ragionate.`
        : `Ha senso: la stanchezza tende a farsi sentire soprattutto nella lucidità delle decisioni, anche quando i numeri non mostrano un pattern specifico come oggi.`;
    case 'frustrated':
      return hasRevenge
        ? `Coincide esattamente con quello che i dati mostrano: hai riaperto una posizione entro 5 minuti dalla chiusura in rosso ${stat.revenge} volt${stat.revenge===1?'a':'e'}. È il pattern più tipico legato proprio a questa emozione — si chiama "revenge trading".`
        : `La frustrazione dopo una perdita è tra le emozioni più comuni nel trading. Qui i dati non mostrano rientri rapidissimi, ma può comunque aver influenzato altre scelte, come la dimensione delle posizioni.`;
    case 'pressure':
      return `Le pressioni esterne hanno un modo subdolo di entrare nelle decisioni di trading, anche quando pensiamo di riuscire a separarle. ${hasBigLoss ? `In questo periodo una singola operazione ha pesato per il ${stat.worstShare.toFixed(0)}% della perdita totale — vale la pena chiedersi se quella posizione è stata aperta con la stessa calma delle altre.` : ''}`;
    case 'overconf':
      return hasBigSize
        ? `Dopo una serie positiva è comune alzare la posta senza accorgersene. Guarda il confronto sulla size qui sotto rispetto ai tuoi periodi migliori: spesso è lì che si vede il segnale più chiaro.`
        : `Dopo una serie di vincite la sicurezza può trasformarsi in meno prudenza sulle uscite, anche se la size resta invariata.`;
    case 'anxious':
      return `L'ansia per il mercato spinge spesso a entrare e uscire più nervosamente del solito, anche a parità di analisi tecnica. ${hasRevenge ? `Qui in effetti si vedono ${stat.revenge} rientr${stat.revenge===1?'o':'i'} molto ravvicinat${stat.revenge===1?'o':'i'} nel tempo.` : ''}`;
    default:
      return `Va benissimo anche non saperlo con precisione — non tutte le giornate hanno una causa emotiva chiara e identificabile. A volte è semplicemente variabilità del mercato.`;
  }
}

function brainCopingClosing(copingId, emotionId){
  const emo = BRAIN_EMOTION_OPTIONS.find(e=>e.id===emotionId);
  const cop = BRAIN_COPING_OPTIONS.find(c=>c.id===copingId);
  const base = `Hai indicato "${emo ? emo.label.toLowerCase() : '—'}" come stato d'animo e "${cop ? cop.label.toLowerCase() : '—'}" come possibile strategia.`;
  switch(copingId){
    case 'pause':
      return `${base} È una delle strategie più efficaci contro le decisioni impulsive: darti un tempo fisso, anche breve, prima di poter riaprire una posizione dopo una perdita. Prova a fissarne uno concreto (es. 20 minuti) e a rispettarlo alla prossima occasione simile.`;
    case 'journal':
      return `${base} Scrivere una riga prima di ogni trade — anche solo "mi sento calmo" o "sono nervoso dopo la perdita di prima" — crea uno spazio tra l'emozione e l'azione. Spesso basta quello per accorgersi in tempo.`;
    case 'limit':
      return `${base} Un tetto massimo (di operazioni o di perdita giornaliera) toglie la decisione dal momento più emotivo e la sposta a un momento più lucido, quando lo hai fissato.`;
    case 'stop':
      return `${base} A volte la mossa più efficace è semplicemente non essere più davanti allo schermo. Non è arrendersi: è riconoscere il momento giusto per fermarsi.`;
    default:
      return `${base} Va bene anche prendersi del tempo per pensarci — l'importante è che la domanda resti aperta, non che la risposta sia immediata.`;
  }
}

function initBrainChat(dayStats){
  const patternNote = [];
  if(dayStats.revenge>0) patternNote.push(`${dayStats.revenge} rientr${dayStats.revenge===1?'o rapido':'i rapidi'} dopo una perdita`);
  if(dayStats.worstShare>=50) patternNote.push(`una singola operazione che pesa per il ${dayStats.worstShare.toFixed(0)}% della perdita totale`);
  const greeting = patternNote.length
    ? `Ho guardato l'ultima giornata (${fmtDateIT(dayStats.label)}, ${fmtMoney(dayStats.pnl,true)}): noto ${patternNote.join(' e ')}. Prima di queste operazioni, come ti sentivi?`
    : `Ho guardato l'ultima giornata (${fmtDateIT(dayStats.label)}, ${fmtMoney(dayStats.pnl,true)}). Prima di queste operazioni, come ti sentivi?`;
  STATE.brainChatMessages = [{ from:'bot', text: greeting }];
  STATE.brainChatStep = 1;
  STATE.brainChatEmotion = null;
  STATE.brainChatCoping = null;
}

function renderBrainChat(dayStats){
  if(STATE.brainChatStep===0) initBrainChat(dayStats);

  const bubbles = STATE.brainChatMessages.map(m=>
    `<div class="brain-chat-bubble ${m.from}">${m.text}</div>`
  ).join('');

  let quickReplies = '';
  if(STATE.brainChatStep===1){
    quickReplies = BRAIN_EMOTION_OPTIONS.map(o=>`<button class="brain-chat-option" data-emotion="${o.id}">${o.label}</button>`).join('');
  } else if(STATE.brainChatStep===2){
    quickReplies = BRAIN_COPING_OPTIONS.map(o=>`<button class="brain-chat-option" data-coping="${o.id}">${o.label}</button>`).join('');
  } else if(STATE.brainChatStep===3){
    quickReplies = `<button class="brain-chat-option brain-chat-restart" id="btnRestartBrainChat">↺ Rifai il check-in</button>`;
  }

  return `
    <div class="brain-chat">
      <div class="brain-chat-messages" id="brainChatMessages">${bubbles}</div>
      <div class="brain-chat-options">${quickReplies}</div>
    </div>
  `;
}

function renderBrainHistory(){
  if(!STATE.brainCheckins.length){
    return '<div class="hint">Non hai ancora completato nessun check-in. Vai sulla scheda "Check-in" e rispondi alle domande per iniziare a costruire uno storico — servono almeno un paio di sessioni per vedere un pattern.</div>';
  }
  const losses = STATE.brainCheckins.filter(c=>c.pnl<0);
  const wins = STATE.brainCheckins.filter(c=>c.pnl>=0);

  function tally(list){
    const counts = {};
    list.forEach(c=>{ counts[c.emotion] = (counts[c.emotion]||0)+1; });
    return Object.entries(counts)
      .map(([id,count])=>({ id, count, label: (BRAIN_EMOTION_OPTIONS.find(o=>o.id===id)||{}).label || id }))
      .sort((a,b)=>b.count-a.count);
  }

  function renderTally(list, total){
    if(!list.length) return '<div class="hint">Nessun check-in in questa categoria finora.</div>';
    return `<div class="brain-tally">${list.map(t=>`
      <div class="brain-tally-row">
        <span class="brain-tally-label">${t.label}</span>
        <div class="brain-tally-bar-wrap"><div class="brain-tally-bar" style="width:${(t.count/total*100).toFixed(0)}%;"></div></div>
        <span class="brain-tally-count">${t.count}× · ${(t.count/total*100).toFixed(0)}%</span>
      </div>`).join('')}</div>`;
  }

  const log = [...STATE.brainCheckins].sort((a,b)=>b.completedAt.localeCompare(a.completedAt));

  return `
    <div class="brain-intro">Hai completato <b>${STATE.brainCheckins.length}</b> check-in — <b>${losses.length}</b> in periodi in perdita, <b>${wins.length}</b> in periodi positivi.</div>

    <div class="brain-subtitle">Emozioni più comuni nelle perdite</div>
    ${renderTally(tally(losses), losses.length)}

    ${wins.length ? `
    <div class="brain-subtitle" style="margin-top:16px;">Emozioni più comuni nei periodi positivi</div>
    ${renderTally(tally(wins), wins.length)}
    ` : ''}

    <div class="brain-subtitle" style="margin-top:16px;">Storico dei check-in</div>
    <div class="brain-history-log">
      ${log.map(c=>{
        const emo = BRAIN_EMOTION_OPTIONS.find(o=>o.id===c.emotion);
        return `<div class="brain-history-row">
          <span class="brain-history-date">${fmtDateIT(c.date)}</span>
          <span class="brain-history-pnl ${c.pnl>=0?'pos':'neg'}">${fmtMoney(c.pnl,true)}</span>
          <span class="brain-history-emotion">${emo ? emo.label : c.emotion}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="hint" style="margin-top:12px;">Più check-in completi, più queste percentuali diventano significative — con poche sessioni un singolo caso può pesare molto.</div>
  `;
}

function renderEconCalendar(){
  const now = new Date();
  const events = [...ECON_CALENDAR_USA].sort((a,b)=> new Date(a.iso)-new Date(b.iso));
  const nextIdx = events.findIndex(e => new Date(e.iso) > now);
  const TYPE_ICON = { data:'', holiday:'🔒 ', political:'🏛️ ', fed:'🏦 ' };

  const rows = events.map((e,i)=>{
    const d = new Date(e.iso);
    const isPast = d <= now;
    const isNext = i === nextIdx;
    const dateLabel = d.toLocaleDateString('it-IT', { weekday:'short', day:'2-digit', month:'2-digit', timeZone:'America/New_York' });
    const timeLabel = d.toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit', timeZone:'America/New_York' });
    const isHoliday = e.type==='holiday';
    const badgeLabel = isHoliday ? 'Mercati chiusi' : (e.importance==='high' ? 'Alta' : e.importance==='medium' ? 'Media' : 'Bassa');
    const badgeClass = isHoliday ? 'holiday' : e.importance;
    const pastLabel = isHoliday ? ' · passata' : ' · già rilasciato';
    return `<div class="econ-row ${isPast?'past':''} ${isNext?'next':''}">
      <div class="econ-when">
        <div class="econ-date">${dateLabel}</div>
        <div class="econ-time">${isHoliday?'tutto il giorno':timeLabel+' ET'}</div>
      </div>
      <div class="econ-main">
        <div class="econ-name">${TYPE_ICON[e.type]||''}${e.name}${isNext?'<span class="econ-next-tag">Prossimo</span>':''}</div>
        <div class="econ-period">${e.period}${isPast?pastLabel:''}</div>
        <div class="econ-impact">${e.impact}</div>
      </div>
      <span class="econ-badge ${badgeClass}">${badgeLabel}</span>
    </div>`;
  }).join('');

  return `
    <div class="econ-legend">
      <span><span class="econ-badge high" style="margin-right:5px;">Alta</span>impatto potenziale forte</span>
      <span>🔒 festività, mercati chiusi</span>
      <span>🏦 evento Federal Reserve</span>
      <span>🏛️ evento politico/istituzionale</span>
    </div>
    <div class="econ-list">${rows}</div>
    <div class="hint" style="margin-top:12px;">Dati economici e festività verificati su fonti ufficiali (BLS, Census Bureau, Federal Reserve, BEA, NYSE/Nasdaq, ONU) il ${ECON_CALENDAR_LAST_VERIFIED}. <b>Il calendario giornaliero della Casa Bianca (conferenze stampa, interventi estemporanei) viene reso noto solo 1-3 giorni prima</b> — non esiste un calendario mensile ufficiale come per i dati economici, quindi qui compaiono solo eventi con una data istituzionale già nota; interventi non ancora annunciati non possono essere previsti. Nulla si aggiorna automaticamente: chiedimi di aggiornarlo per i mesi successivi, o a ridosso di una data se ti serve la situazione più recente. Orari in ora di New York (ET) — confronta con l'orologio "New York" nella barra in alto.</div>
  `;
}

function optionWeekLabel(offsetWeeks){
  const today = new Date(); today.setHours(0,0,0,0);
  const todayIso = today.toISOString().slice(0,10);
  const monday = mondayOf(todayIso);
  const start = addDaysISO(monday, offsetWeeks*7);
  const end = addDaysISO(start, 6);
  return { start, end, label: offsetWeeks===0 ? 'Settimana corrente' : 'Settimana successiva' };
}

function renderOptionRow(o){
  const days = Math.ceil((new Date(o.expiration+'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
  const dayLabel = days===0 ? 'scade oggi' : days===1 ? 'scade domani' : days>1 ? `scade tra ${days} giorni` : 'scaduta';
  return `<div class="opt-row">
    <div class="opt-type ${o.type}">${o.type==='call'?'CALL':'PUT'}</div>
    <div class="opt-main">
      <div class="opt-strike">${o.symbol} · strike ${o.strike}</div>
      <div class="opt-sub">${o.contracts} contratti · scadenza ${fmtDateIT(o.expiration)} <span class="opt-days">(${dayLabel})</span>${o.note?` · ${o.note}`:''}</div>
    </div>
    <span class="opt-delete" data-id="${o.id}" title="Clicca due volte per rimuovere">✕</span>
  </div>`;
}
