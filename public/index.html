/* ============================================================
   DIREZIONE REALE — il campo "Buy or Sell" del broker non è
   affidabile (verificato: ~60% delle righe etichettate Sell si
   comportano in realtà da Buy). Quando abbiamo un P&L reale
   (non stimato), deduciamo la direzione vera dal prezzo e dal
   segno del profitto, invece di fidarci dell'etichetta dichiarata.
   ============================================================ */
function impliedSide(t){
  if(t.estimated) return t.side; // nessun P&L reale con cui verificare: manteniamo la dichiarazione
  if(t.closePrice < t.openPrice) return t.pnl >= 0 ? 'Sell' : 'Buy';
  if(t.closePrice > t.openPrice) return t.pnl >= 0 ? 'Buy' : 'Sell';
  return t.side; // apertura = chiusura, direzione non deducibile dal prezzo
}
function sideWasCorrected(t){
  return !t.estimated && impliedSide(t) !== t.side;
}

function dowLabel(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  const names = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  return names[d.getDay()];
}

function fmtDuration(mins){
  const totalSec = Math.round(mins*60);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  if(h>0) return `${h}h ${m}min`;
  if(m>0) return `${m}min ${s}s`;
  return `${s}s`;
}

/* ============================================================
   ELEMENTI IN COMUNE TRA TRADE CON ESITO SIMILE
   confronta il gruppo selezionato (vinti o persi) con la media
   dell'intero conto, per trovare pattern tecnici e psicologici
   ============================================================ */
function computeGroupCommonalities(kind, groupTrades, allTradesSorted, accountAvgHold, accountAvgVolume){
  const technical = [], psychological = [];
  if(groupTrades.length===0) return {technical, psychological};

  const holds = groupTrades.map(holdMinutes);
  const avgHold = holds.reduce((a,b)=>a+b,0)/holds.length;
  const avgVol = groupTrades.reduce((s,t)=>s+t.volume,0)/groupTrades.length;

  if(accountAvgHold>0 && avgHold < accountAvgHold*0.6){
    technical.push(`Durata media breve: ${Math.round(avgHold)} min, contro una media di conto di ${Math.round(accountAvgHold)} min.`);
    psychological.push(kind==='loss'
      ? `Chiudere in fretta una posizione in perdita può voler dire tagliare bene il rischio — ma se succede prima che il trade abbia avuto tempo di svilupparsi, può segnalare ansia o assenza di un piano di uscita chiaro.`
      : `Prese di profitto rapide: puoi aver rispettato un target preciso, oppure aver chiuso in anticipo per paura di perdere il guadagno già in mano.`);
  } else if(accountAvgHold>0 && avgHold > accountAvgHold*1.4){
    technical.push(`Durata media lunga: ${Math.round(avgHold)} min, contro una media di conto di ${Math.round(accountAvgHold)} min.`);
    psychological.push(kind==='loss'
      ? `Tenere a lungo una posizione in perdita può indicare difficoltà ad accettare l'errore, sperando in un'inversione del prezzo.`
      : `Hai lasciato correre il trade più del solito: coerente con un'idea in cui ti sentivi sicuro.`);
  }

  if(accountAvgVolume>0 && avgVol > accountAvgVolume*1.15){
    technical.push(`Size sopra la tua media: ${avgVol.toFixed(3)} lotti, contro ${accountAvgVolume.toFixed(3)} di media conto.`);
    psychological.push(kind==='loss'
      ? `Una size più alta della norma su operazioni finite in perdita può indicare un tentativo di recuperare in fretta perdite precedenti.`
      : `Una size più alta della norma su operazioni vincenti può indicare alta convinzione sul setup.`);
  } else if(accountAvgVolume>0 && avgVol < accountAvgVolume*0.85){
    technical.push(`Size sotto la tua media: ${avgVol.toFixed(3)} lotti, contro ${accountAvgVolume.toFixed(3)} di media conto.`);
  }

  const dowCounts = {};
  groupTrades.forEach(t=>{ const d=dowLabel(t.closeDate); dowCounts[d]=(dowCounts[d]||0)+1; });
  const topDow = Object.entries(dowCounts).sort((a,b)=>b[1]-a[1])[0];
  if(topDow && groupTrades.length>1 && topDow[1] >= Math.ceil(groupTrades.length*0.5)){
    technical.push(`${topDow[1]} operazioni su ${groupTrades.length} sono di ${topDow[0]}.`);
  }

  let precededByLoss=0, precededByWin=0, withPrev=0;
  groupTrades.forEach(t=>{
    const idx = allTradesSorted.findIndex(x=>x.id===t.id);
    if(idx<=0) return;
    withPrev++;
    if(allTradesSorted[idx-1].pnl<0) precededByLoss++; else precededByWin++;
  });
  if(withPrev>0 && precededByLoss/withPrev >= 0.5 && groupTrades.length>1){
    const pct = Math.round(precededByLoss/withPrev*100);
    psychological.push(kind==='loss'
      ? `Il ${pct}% di queste operazioni è arrivato subito dopo un'altra chiusa in perdita — pattern coerente con il "revenge trading".`
      : `Il ${pct}% di queste operazioni è arrivato dopo una perdita precedente, eppure ha comunque vinto — segno che rientrare dopo una perdita non è sempre un problema, dipende dal setup.`);
  } else if(withPrev>0 && precededByWin/withPrev >= 0.6 && groupTrades.length>1){
    const pct = Math.round(precededByWin/withPrev*100);
    psychological.push(`Il ${pct}% di queste operazioni è arrivato subito dopo una vincita — possibile stato di fiducia o "flow".`);
  }

  if(technical.length===0) technical.push('Nessun elemento tecnico (durata, size, giorno) chiaramente fuori dalla tua media su questo gruppo.');
  if(psychological.length===0) psychological.push('Nessun pattern psicologico evidente solo dai numeri — confronta con quello che ricordi/vedi nel grafico di ciascun trade.');

  return {technical: technical.slice(0,3), psychological: psychological.slice(0,3)};
}

function computeWeeklyStats(trades, startingCapital){
  const groups = {};
  trades.forEach(t=>{
    const wk = mondayOf(t.closeDate);
    (groups[wk] = groups[wk] || []).push(t);
  });
  let runningCapital = startingCapital;
  return Object.keys(groups).sort().map(weekStart=>{
    const list = [...groups[weekStart]].sort((a,b)=>dt(a)-dt(b));
    const wins = list.filter(t=>t.pnl>0), losses = list.filter(t=>t.pnl<0);
    const pnl = list.reduce((s,t)=>s+t.pnl,0);
    const avgVolume = list.reduce((s,t)=>s+t.volume,0)/list.length;
    const holds = list.map(holdMinutes);
    const avgHold = holds.reduce((a,b)=>a+b,0)/holds.length;
    const sortedHolds = [...holds].sort((a,b)=>a-b);
    const medianHold = sortedHolds[Math.floor(sortedHolds.length/2)];
    let revenge = 0;
    for(let i=1;i<list.length;i++){
      if(list[i-1].pnl<0){
        const o = new Date(`${list[i].openDate}T${list[i].openTime||'00:00:00'}`);
        const c = new Date(`${list[i-1].closeDate}T${list[i-1].closeTime||'00:00:00'}`);
        const gap = (o-c)/60000;
        if(gap>=0 && gap<=5) revenge++;
      }
    }
    // drawdown settimanale: dal capitale con cui la settimana è iniziata
    const weekStartBalance = runningCapital;
    let bal = weekStartBalance, minBal = weekStartBalance;
    list.forEach(t=>{ bal += t.pnl; if(bal<minBal) minBal = bal; });
    const weekDD = Math.max(0, weekStartBalance - minBal);
    const weekDDpct = weekStartBalance>0 ? weekDD/weekStartBalance*100 : 0;
    runningCapital = bal;
    return {
      weekStart, weekEnd: addDaysISO(weekStart,6),
      trades:list.length, wins:wins.length, losses:losses.length,
      winRate: list.length? wins.length/list.length*100 : 0,
      pnl, avgVolume, avgHold, medianHold, revenge, list,
      weekStartBalance, weekDD, weekDDpct
    };
  });
}

function generateWeeklyInsights(weeks){
  const withTrades = weeks.filter(w=>w.trades>0);
  if(withTrades.length<2) return null;
  const sorted = [...withTrades].sort((a,b)=>b.pnl-a.pnl);
  const best = sorted[0], worst = sorted[sorted.length-1];
  if(best===worst) return null;
  const bullets = [];
  const recommendations = [];

  if(Math.abs(worst.trades-best.trades) >= 3){
    const ratio = best.trades>0 ? (worst.trades/best.trades) : 0;
    bullets.push(`<b>Numero di operazioni:</b> ${best.trades} nella settimana migliore contro ${worst.trades} in quella peggiore${ratio>=1.5?` (circa ${ratio.toFixed(1)}× di più)`:ratio<=0.67&&ratio>0?` (circa ${(1/ratio).toFixed(1)}× di meno)`:''}.`);
    if(ratio>=1.8){
      recommendations.push(`Fissati un <b>numero massimo di operazioni al giorno</b> (prova a restare vicino a ${Math.max(1,Math.round(best.trades/5))}-${Math.max(2,Math.round(best.trades/4))}, la media della tua settimana migliore) e fermati quando lo raggiungi, indipendentemente da come sta andando.`);
    }
  }
  if(Math.abs(best.medianHold-worst.medianHold) > 8){
    bullets.push(`<b>Durata delle posizioni:</b> tempo mediano di mantenimento di ${Math.round(best.medianHold)} min nella settimana migliore, contro ${Math.round(worst.medianHold)} min in quella peggiore.`);
    if(best.medianHold > worst.medianHold*1.5){
      recommendations.push(`Prima di chiudere una posizione entro pochi minuti dall'apertura, chiediti se lo stai facendo per un motivo tecnico preciso o solo per nervosismo — nelle tue settimane migliori hai lasciato più spazio ai trade per svilupparsi.`);
    }
  }
  const bestRevRate = best.losses? best.revenge/best.losses*100 : 0;
  const worstRevRate = worst.losses? worst.revenge/worst.losses*100 : 0;
  if(worstRevRate - bestRevRate > 10){
    bullets.push(`<b>Rientro rapido dopo una perdita:</b> nella settimana peggiore il ${worstRevRate.toFixed(0)}% delle perdite è stato seguito entro 5 minuti da una nuova apertura, contro il ${bestRevRate.toFixed(0)}% nella settimana migliore — un possibile segnale di "revenge trading".`);
    recommendations.push(`Imponiti una <b>pausa obbligatoria di almeno 15-30 minuti</b> dopo ogni operazione in perdita prima di aprirne un'altra. È il pattern più chiaro tra le tue settimane buone e cattive.`);
  }
  if(best.avgVolume>0 && Math.abs(worst.avgVolume-best.avgVolume)/best.avgVolume > 0.15){
    bullets.push(`<b>Dimensione delle posizioni:</b> volume medio di ${worst.avgVolume.toFixed(3)} lotti nella settimana peggiore contro ${best.avgVolume.toFixed(3)} nella migliore.`);
    if(worst.avgVolume > best.avgVolume){
      recommendations.push(`Non aumentare la size delle operazioni per "recuperare" una settimana negativa: nei tuoi dati è successo il contrario di quello che serve — la size è salita proprio quando i risultati peggioravano.`);
    }
  }
  bullets.push(`<b>Win rate:</b> ${best.winRate.toFixed(0)}% nella settimana migliore contro ${worst.winRate.toFixed(0)}% in quella peggiore.`);

  return {best, worst, bullets, recommendations};
}

/* ============================================================
   🧠 ANALISI ULTIMA GIORNATA / ULTIMA SETTIMANA — legge sempre i
   dati reali attualmente presenti (nel conto/filtro selezionato),
   non valori fissi: "ultima giornata" e "ultima settimana" sono
   ricalcolati ogni volta rispetto all'operazione più recente
   registrata, così restano corretti indipendentemente da quando
   viene aperta la piattaforma.
   ============================================================ */
function accountWideAverages(trades){
  if(!trades.length) return { avgVolume:0, avgHold:0, avgDailyPnl:0, avgDailyTrades:0, winRate:0 };
  const avgVolume = trades.reduce((s,t)=>s+t.volume,0)/trades.length;
  const avgHold = trades.map(holdMinutes).reduce((a,b)=>a+b,0)/trades.length;
  const byDay = {};
  trades.forEach(t=>{ (byDay[t.closeDate]=byDay[t.closeDate]||[]).push(t); });
  const days = Object.values(byDay);
  const avgDailyPnl = days.reduce((s,d)=>s+d.reduce((a,t)=>a+t.pnl,0),0)/days.length;
  const avgDailyTrades = trades.length/days.length;
  const winRate = trades.filter(t=>t.pnl>0).length/trades.length*100;
  return { avgVolume, avgHold, avgDailyPnl, avgDailyTrades, winRate };
}

// allTradesSorted + capitalBase servono per calcolare il saldo a inizio periodo,
// da cui derivano sia il drawdown interno al periodo sia il "rischio" della
// singola operazione peggiore in percentuale sul capitale di quel momento
function analyzePeriod(periodTrades, label, allTradesSorted, capitalBase){
  const sorted = [...periodTrades].sort((a,b)=>dt(a)-dt(b));
  const wins = sorted.filter(t=>t.pnl>0), losses = sorted.filter(t=>t.pnl<=0);
  const pnl = sorted.reduce((s,t)=>s+t.pnl,0);
  const avgVolume = sorted.length ? sorted.reduce((s,t)=>s+t.volume,0)/sorted.length : 0;
  const avgHold = sorted.length ? sorted.map(holdMinutes).reduce((a,b)=>a+b,0)/sorted.length : 0;
  let revenge = 0;
  for(let i=1;i<sorted.length;i++){
    if(sorted[i-1].pnl<=0){
      const o = new Date(`${sorted[i].openDate}T${sorted[i].openTime||'00:00:00'}`);
      const c = new Date(`${sorted[i-1].closeDate}T${sorted[i-1].closeTime||'00:00:00'}`);
      const gap = (o-c)/60000;
      if(gap>=0 && gap<=5) revenge++;
    }
  }
  const worstTrade = losses.length ? losses.reduce((a,b)=> b.pnl<a.pnl?b:a) : null;
  const worstShare = (pnl<0 && worstTrade) ? Math.abs(worstTrade.pnl/pnl)*100 : 0;
  const grossProfit = wins.reduce((s,t)=>s+t.pnl,0);
  const grossLoss = Math.abs(losses.reduce((s,t)=>s+t.pnl,0));
  const profitFactor = grossLoss>0 ? grossProfit/grossLoss : (grossProfit>0 ? null : 0); // null = "nessuna perdita nel periodo"

  let startBalance = capitalBase, periodDD = 0, periodDDpct = 0;
  if(allTradesSorted && capitalBase!=null && sorted.length){
    let bal = capitalBase;
    const firstId = sorted[0].id;
    for(const t of allTradesSorted){
      if(t.id===firstId) break;
      bal += t.pnl;
    }
    startBalance = bal;
    let minBal = bal;
    sorted.forEach(t=>{ bal += t.pnl; if(bal<minBal) minBal = bal; });
    periodDD = Math.max(0, startBalance - minBal);
    periodDDpct = startBalance>0 ? periodDD/startBalance*100 : 0;
  }
  const worstLossPct = (worstTrade && startBalance>0) ? Math.abs(worstTrade.pnl)/startBalance*100 : 0;

  return {
    label, trades: sorted, count: sorted.length,
    wins: wins.length, losses: losses.length,
    winRate: sorted.length ? wins.length/sorted.length*100 : 0,
    pnl, avgVolume, avgHold, revenge, worstTrade, worstShare, profitFactor,
    startBalance, periodDD, periodDDpct, worstLossPct
  };
}

// spacchetta i trade di un conto in una lista di analisi per-giorno, usata
// per trovare la GIORNATA MIGLIORE su cui basare il confronto
function computeAllDaysStats(trades, capitalBase){
  const byDay = {};
  trades.forEach(t=>{ (byDay[t.closeDate]=byDay[t.closeDate]||[]).push(t); });
  const sorted = [...trades].sort((a,b)=>dt(a)-dt(b));
  return Object.keys(byDay).sort().map(date => analyzePeriod(byDay[date], date, sorted, capitalBase));
}

function findBestByPnl(periods){
  return periods.reduce((best,p)=> (!best || p.pnl>best.pnl) ? p : best, null);
}

function compareToBest(current, best, isDay){
  if(!best || best.label===current.label || best.pnl<=current.pnl) return [];
  const unit = isDay ? 'giornata' : 'settimana';
  const bestLabel = isDay ? fmtDateIT(best.label) : best.label;
  const c = [];
  c.push(`Nella tua ${unit} migliore (${bestLabel}, ${fmtMoney(best.pnl,true)}) il win rate era del ${best.winRate.toFixed(0)}%, contro il ${current.winRate.toFixed(0)}% di questa volta.`);
  if(best.profitFactor!=null && current.profitFactor!=null && Math.abs(best.profitFactor-current.profitFactor)>0.3){
    c.push(`Profit factor di ${best.profitFactor.toFixed(2)} in quel periodo, contro ${current.profitFactor.toFixed(2)} in questo.`);
  }
  if(Math.abs(best.avgHold-current.avgHold) > 8){
    c.push(`Tenevi le posizioni aperte in media ${best.avgHold.toFixed(0)} min, contro i ${current.avgHold.toFixed(0)} min di questa volta.`);
  }
  if(best.avgVolume>0 && Math.abs(current.avgVolume-best.avgVolume)/best.avgVolume > 0.15){
    c.push(`La size media era di ${best.avgVolume.toFixed(3)} lotti, contro ${current.avgVolume.toFixed(3)} di questa volta.`);
  }
  if(best.revenge===0 && current.revenge>0){
    c.push(`Nella ${unit} migliore non c'è stato nessun rientro rapido dopo una perdita; in questa ce ne sono stati ${current.revenge}.`);
  }
  return c;
}

function generateBrainFeedback(dayStats, weekStats, avg, bestDay, bestWeek){
  function bulletsFor(stat, isDay){
    const b = [];
    if(!stat || !stat.count) return b;
    const unit = isDay ? 'in questa giornata' : 'in questa settimana';
    const expectedCount = isDay ? avg.avgDailyTrades : avg.avgDailyTrades*5;
    if(stat.pnl < 0){
      b.push(`Risultato negativo ${unit}: <b>${fmtMoney(stat.pnl,true)}</b> su ${stat.count} operazioni (${stat.wins} vinte, ${stat.losses} perse).`);
    } else {
      b.push(`Risultato positivo ${unit}: <b>${fmtMoney(stat.pnl,true)}</b> su ${stat.count} operazioni (${stat.wins} vinte, ${stat.losses} perse).`);
    }
    if(stat.periodDDpct > 0.5){
      b.push(`Drawdown interno al periodo: <b>−${stat.periodDDpct.toFixed(1).replace('.',',')}%</b> dal capitale disponibile a inizio periodo (${fmtMoney(stat.startBalance)}).`);
    }
    if(stat.worstTrade && stat.worstLossPct>0){
      b.push(`Rischio realizzato: la singola operazione peggiore (${stat.worstTrade.id}) ha impegnato circa il <b>${stat.worstLossPct.toFixed(1).replace('.',',')}%</b> del capitale disponibile in quel momento.`);
    }
    if(stat.count >= expectedCount*1.6 && expectedCount>0){
      b.push(`Frequenza sopra la norma: ${stat.count} operazioni contro una media di circa ${expectedCount.toFixed(0)} — possibile segnale di overtrading.`);
    }
    if(stat.revenge>0){
      b.push(`Rientro rapido dopo una perdita rilevato ${stat.revenge} volt${stat.revenge===1?'a':'e'}: una nuova posizione aperta entro 5 minuti dalla chiusura in rosso della precedente.`);
    }
    if(avg.avgVolume>0 && stat.avgVolume > avg.avgVolume*1.3){
      b.push(`Size media più alta del solito: ${stat.avgVolume.toFixed(3)} lotti contro una media di conto di ${avg.avgVolume.toFixed(3)}.`);
    }
    if(stat.worstTrade && stat.worstShare>=50){
      b.push(`Una singola operazione (${stat.worstTrade.id}, ${fmtMoney(stat.worstTrade.pnl,true)}) pesa da sola per il ${stat.worstShare.toFixed(0)}% della perdita totale del periodo.`);
    }
    if(avg.avgHold>0 && stat.avgHold < avg.avgHold*0.5 && stat.losses>stat.wins){
      b.push(`Durata media delle posizioni molto più corta del solito (${stat.avgHold.toFixed(0)} min contro ${avg.avgHold.toFixed(0)} min di media) in un periodo a prevalenza di perdite — possibile uscita anticipata/impulsiva.`);
    }
    return b;
  }

  function recommendationsFor(stat, compareBullets){
    const r = [];
    if(!stat || !stat.count) return r;
    if(stat.revenge>0) r.push('Prova a imporre una pausa minima dopo ogni perdita, prima di aprire la posizione successiva — è il pattern più ricorrente nei periodi peggiori.');
    if(stat.worstShare>=50) r.push('Valuta un limite di perdita massima per singola operazione: in questo periodo un solo trade ha pesato più di tutti gli altri messi insieme.');
    if(compareBullets.some(c=>c.includes('min, contro'))) r.push('Riportare la durata media delle posizioni verso quella dei tuoi periodi migliori sembra il fattore più direttamente collegato al risultato.');
    if(!r.length && stat.pnl<0) r.push('Nessun pattern ricorrente evidente: può essere semplicemente variabilità normale del mercato, non un errore di approccio.');
    return r.slice(0,2);
  }

  const dayCompare = compareToBest(dayStats, bestDay, true);
  const weekCompare = compareToBest(weekStats, bestWeek, false);

  return {
    dayBullets: bulletsFor(dayStats, true),
    weekBullets: bulletsFor(weekStats, false),
    dayCompare, weekCompare,
    dayRecs: recommendationsFor(dayStats, dayCompare),
    weekRecs: recommendationsFor(weekStats, weekCompare)
  };
}

/* ============================================================
   RENDICONTO MENSILE — stessa logica di quello settimanale,
   raggruppata per mese di calendario invece che per settimana
   ============================================================ */
const MONTH_NAMES_IT = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

function monthKeyOf(dateStr){ return dateStr.slice(0,7); } // 'YYYY-MM'
function monthLabelIT(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return `${MONTH_NAMES_IT[m-1]} ${y}`;
}
function monthShortIT(monthKey){
  const [,m] = monthKey.split('-').map(Number);
  return MONTH_NAMES_IT[m-1].slice(0,3);
}
function monthRangeISO(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  const lastDay = new Date(y, m, 0).getDate(); // trucco: giorno 0 del mese successivo = ultimo giorno di questo mese
  return { start: `${monthKey}-01`, end: `${monthKey}-${String(lastDay).padStart(2,'0')}` };
}

function computeMonthlyStats(trades, startingCapital){
  const groups = {};
  trades.forEach(t=>{
    const mk = monthKeyOf(t.closeDate);
    (groups[mk] = groups[mk] || []).push(t);
  });
  let runningCapital = startingCapital;
  return Object.keys(groups).sort().map(monthKey=>{
    const list = [...groups[monthKey]].sort((a,b)=>dt(a)-dt(b));
    const wins = list.filter(t=>t.pnl>0), losses = list.filter(t=>t.pnl<0);
    const pnl = list.reduce((s,t)=>s+t.pnl,0);
    const avgVolume = list.reduce((s,t)=>s+t.volume,0)/list.length;
    const holds = list.map(holdMinutes);
    const avgHold = holds.reduce((a,b)=>a+b,0)/holds.length;
    const sortedHolds = [...holds].sort((a,b)=>a-b);
    const medianHold = sortedHolds[Math.floor(sortedHolds.length/2)];
    let revenge = 0;
    for(let i=1;i<list.length;i++){
      if(list[i-1].pnl<0){
        const o = new Date(`${list[i].openDate}T${list[i].openTime||'00:00:00'}`);
        const c = new Date(`${list[i-1].closeDate}T${list[i-1].closeTime||'00:00:00'}`);
        const gap = (o-c)/60000;
        if(gap>=0 && gap<=5) revenge++;
      }
    }
    const {start: monthStart, end: monthEnd} = monthRangeISO(monthKey);
    const monthStartBalance = runningCapital;
    let bal = monthStartBalance, minBal = monthStartBalance;
    list.forEach(t=>{ bal += t.pnl; if(bal<minBal) minBal = bal; });
    const monthDD = Math.max(0, monthStartBalance - minBal);
    const monthDDpct = monthStartBalance>0 ? monthDD/monthStartBalance*100 : 0;
    const monthReturnPct = monthStartBalance>0 ? pnl/monthStartBalance*100 : 0;
    runningCapital = bal;
    return {
      monthKey, monthStart, monthEnd, label: monthLabelIT(monthKey), shortLabel: monthShortIT(monthKey),
      trades:list.length, wins:wins.length, losses:losses.length,
      winRate: list.length? wins.length/list.length*100 : 0,
      pnl, avgVolume, avgHold, medianHold, revenge, list,
      monthStartBalance, monthDD, monthDDpct, monthReturnPct
    };
  });
}

function generateMonthlyInsights(months){
  const withTrades = months.filter(mo=>mo.trades>0);
  if(withTrades.length<2) return null;
  const sorted = [...withTrades].sort((a,b)=>b.pnl-a.pnl);
  const best = sorted[0], worst = sorted[sorted.length-1];
  if(best===worst) return null;
  const bullets = [];
  const recommendations = [];

  if(Math.abs(worst.trades-best.trades) >= 3){
    const ratio = best.trades>0 ? (worst.trades/best.trades) : 0;
    bullets.push(`<b>Numero di operazioni:</b> ${best.trades} nel mese migliore contro ${worst.trades} in quello peggiore${ratio>=1.5?` (circa ${ratio.toFixed(1)}× di più)`:ratio<=0.67&&ratio>0?` (circa ${(1/ratio).toFixed(1)}× di meno)`:''}.`);
    if(ratio>=1.8){
      recommendations.push(`Anche su base mensile la frequenza sembra pesare sul risultato: valuta un limite di operazioni mensili vicino a quello del tuo mese migliore (${best.trades}).`);
    }
  }
  if(Math.abs(best.medianHold-worst.medianHold) > 8){
    bullets.push(`<b>Durata delle posizioni:</b> tempo mediano di mantenimento di ${Math.round(best.medianHold)} min nel mese migliore, contro ${Math.round(worst.medianHold)} min in quello peggiore.`);
  }
  const bestRevRate = best.losses? best.revenge/best.losses*100 : 0;
  const worstRevRate = worst.losses? worst.revenge/worst.losses*100 : 0;
  if(worstRevRate - bestRevRate > 10){
    bullets.push(`<b>Rientro rapido dopo una perdita:</b> nel mese peggiore il ${worstRevRate.toFixed(0)}% delle perdite è stato seguito entro 5 minuti da una nuova apertura, contro il ${bestRevRate.toFixed(0)}% nel mese migliore.`);
    recommendations.push(`Il pattern di rientro rapido dopo una perdita si conferma anche su base mensile — la pausa obbligatoria dopo una perdita resta il correttivo più indicato dai dati.`);
  }
  if(best.avgVolume>0 && Math.abs(worst.avgVolume-best.avgVolume)/best.avgVolume > 0.15){
    bullets.push(`<b>Dimensione delle posizioni:</b> volume medio di ${worst.avgVolume.toFixed(3)} lotti nel mese peggiore contro ${best.avgVolume.toFixed(3)} nel migliore.`);
    if(worst.avgVolume > best.avgVolume){
      recommendations.push(`Anche a livello mensile la size sale nei periodi peggiori: evita di aumentarla per recuperare un mese negativo.`);
    }
  }
  bullets.push(`<b>Win rate:</b> ${best.winRate.toFixed(0)}% nel mese migliore contro ${worst.winRate.toFixed(0)}% in quello peggiore.`);

  return {best, worst, bullets, recommendations};
}

function renderMonthlyBarsSVG(months, highlightBestWorst){
  const withTrades = months.filter(mo=>mo.trades>0);
  if(!withTrades.length) return '<div style="color:#585D66;font-size:12px;padding:20px 0;">Nessun dato</div>';
  const W=1080, H=220, padL=64, padR=14, padT=24, padB=40;
  const maxAbs = Math.max(...withTrades.map(mo=>Math.abs(mo.pnl)), 1);
  const bw = (W-padL-padR)/withTrades.length;
  const zeroY = padT + (H-padT-padB)/2;
  const scale = (H-padT-padB)/2 / maxAbs;
  const bestKey = highlightBestWorst ? highlightBestWorst.best.monthKey : null;
  const worstKey = highlightBestWorst ? highlightBestWorst.worst.monthKey : null;
  let bars = '', labels = '';
  withTrades.forEach((mo,i)=>{
    const x = padL + i*bw + bw*0.22;
    const bwid = bw*0.56;
    const h = Math.abs(mo.pnl)*scale;
    const y = mo.pnl>=0 ? zeroY-h : zeroY;
    let color = mo.pnl>=0 ? '#5FA989' : '#C15C4A';
    let strokeAttr = '';
    if(mo.monthKey===bestKey) strokeAttr = `stroke="#E4C888" stroke-width="1.5"`;
    if(mo.monthKey===worstKey) strokeAttr = `stroke="#E4C888" stroke-width="1.5" stroke-dasharray="2,2"`;
    const origin = mo.pnl>=0 ? '' : ' origin-top';
    bars += `<rect class="bar-grow${origin}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwid.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" fill="${color}" opacity="0.88" ${strokeAttr}><title>${mo.label}: ${fmtMoney(mo.pnl,true)} (${mo.trades} op.)</title></rect>`;
    const lx = x + bwid/2;
    const valY = mo.pnl>=0 ? y-8 : y+h+16;
    labels += `<text x="${lx.toFixed(1)}" y="${valY.toFixed(1)}" text-anchor="middle" font-size="13" font-weight="600" fill="${color}" font-family="IBM Plex Mono">${fmtMoney(mo.pnl,true)}</text>`;
    labels += `<text x="${lx.toFixed(1)}" y="${H-14}" text-anchor="middle" font-size="13" fill="#8B8F98" font-family="IBM Plex Mono">${mo.shortLabel}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="#262B33" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}

function renderMonthlyDrawdownSVG(months){
  const withTrades = months.filter(mo=>mo.trades>0);
  if(!withTrades.length) return '<div style="color:#585D66;font-size:12px;padding:20px 0;">Nessun dato</div>';
  const W=1080, H=200, padL=64, padR=14, padT=28, padB=40;
  const maxDD = Math.max(...withTrades.map(mo=>mo.monthDDpct), 1);
  const bw = (W-padL-padR)/withTrades.length;
  const scale = (H-padT-padB) / maxDD;
  let bars = '', labels = '';
  let grid = '';
  for(let i=0;i<=2;i++){
    const v = maxDD*i/2;
    const y = padT + (H-padT-padB) - v*scale;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#1E232B" stroke-width="1"/>`;
    grid += `<text x="${padL-10}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="12" fill="#8B8F98" font-family="IBM Plex Mono">-${v.toFixed(0)}%</text>`;
  }
  withTrades.forEach((mo,i)=>{
    const x = padL + i*bw + bw*0.22;
    const bwid = bw*0.56;
    const h = mo.monthDDpct*scale;
    const y = padT + (H-padT-padB) - h;
    bars += `<rect class="bar-grow" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwid.toFixed(1)}" height="${Math.max(h,0.5).toFixed(1)}" fill="#C15C4A" opacity="0.85"><title>${mo.label}: −${mo.monthDDpct.toFixed(1)}% (da ${fmtMoney(mo.monthStartBalance)})</title></rect>`;
    const lx = x + bwid/2;
    labels += `<text x="${lx.toFixed(1)}" y="${H-14}" text-anchor="middle" font-size="13" fill="#8B8F98" font-family="IBM Plex Mono">${mo.shortLabel}</text>`;
    if(mo.monthDDpct>0){
      labels += `<text x="${lx.toFixed(1)}" y="${(y-8).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="600" fill="#C15C4A" font-family="IBM Plex Mono">-${mo.monthDDpct.toFixed(1)}%</text>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg">
    ${grid}
    <line x1="${padL}" y1="${padT + (H-padT-padB)}" x2="${W-padR}" y2="${padT + (H-padT-padB)}" stroke="#262B33" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}

function computeMetrics(trades, capital){
  const sorted = [...trades].sort((a,b)=> dt(a)-dt(b));
  const wins = trades.filter(t=>t.pnl>0);
  const losses = trades.filter(t=>t.pnl<0);
  const totalPnl = trades.reduce((s,t)=>s+t.pnl,0);
  const grossProfit = wins.reduce((s,t)=>s+t.pnl,0);
  const grossLoss = Math.abs(losses.reduce((s,t)=>s+t.pnl,0));
  const balance = capital + totalPnl;
  const winRate = trades.length ? (wins.length/trades.length*100) : 0;
  const avgWin = wins.length ? grossProfit/wins.length : 0;
  const avgLoss = losses.length ? -grossLoss/losses.length : 0;
  const profitFactor = grossLoss>0 ? grossProfit/grossLoss : (grossProfit>0?Infinity:0);
  const best = trades.length ? Math.max(...trades.map(t=>t.pnl)) : 0;
  const worst = trades.length ? Math.min(...trades.map(t=>t.pnl)) : 0;
  const bestTrade = trades.length ? trades.reduce((a,b)=> b.pnl>a.pnl?b:a) : null;
  const worstTrade = trades.length ? trades.reduce((a,b)=> b.pnl<a.pnl?b:a) : null;

  // equity curve + drawdown
  let running = capital, peak = capital, maxDD = 0, maxDDpct = 0, minEquity = capital;
  const equityPoints = [{x:0, y:capital, date:null}];
  sorted.forEach((t,i)=>{
    running += t.pnl;
    peak = Math.max(peak, running);
    minEquity = Math.min(minEquity, running);
    const dd = peak - running;
    if(dd>maxDD){ maxDD = dd; maxDDpct = peak>0? dd/peak*100 : 0; }
    equityPoints.push({x:i+1, y:running, date:t.closeDate});
  });
  // drawdown misurato dal capitale di partenza (non dal picco massimo)
  const capDD = Math.max(0, capital - minEquity);
  const capDDpct = capital>0 ? capDD/capital*100 : 0;

  // current streak
  let streak=0, streakType=null;
  for(let i=sorted.length-1;i>=0;i--){
    const isWin = sorted[i].pnl>0;
    if(streakType===null){ streakType = isWin?'win':'loss'; streak=1; }
    else if((isWin && streakType==='win') || (!isWin && streakType==='loss')) streak++;
    else break;
  }

  // daily pnl — totale e dettaglio operazioni (per i pallini verdi/rossi)
  const byDay = {};
  const tradesByDay = {};
  sorted.forEach(t=>{
    byDay[t.closeDate] = (byDay[t.closeDate]||0) + t.pnl;
    (tradesByDay[t.closeDate] = tradesByDay[t.closeDate] || []).push(t);
  });
  const dailyPnl = Object.entries(byDay).map(([date,pnl])=>({
    date, pnl, trades: tradesByDay[date].sort((a,b)=>dt(a)-dt(b))
  })).sort((a,b)=>a.date.localeCompare(b.date));

  return { sorted, wins, losses, totalPnl, grossProfit, grossLoss, balance, winRate,
    avgWin, avgLoss, profitFactor, best, worst, bestTrade, worstTrade, equityPoints, maxDD, maxDDpct, capDD, capDDpct,
    streak, streakType, dailyPnl,
    returnPct: capital>0 ? totalPnl/capital*100 : 0 };
}

/* ============================================================
   FORMATTERS
   ============================================================ */
const fmtMoney = (v, withSign=false) => {
  const sign = v>0 && withSign ? '+' : (v<0?'-':(withSign?'':''));
  return sign + '$' + Math.abs(v).toFixed(2).replace('.',',');
};
const fmtPct = (v, withSign=false) => {
  const sign = v>0 && withSign ? '+' : (v<0?'-':(withSign?'':''));
  return sign + Math.abs(v).toFixed(2).replace('.',',') + '%';
};
const fmtDateIT = (iso) => {
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
};

/* ============================================================
   INTESTAZIONE PANNELLO CON PULSANTE RIDUCI/ESPANDI
   uso: sostituisce il markup manuale di ".panel-head" in ogni
   sezione, così il comportamento resta identico ovunque.
   ============================================================ */
/* ============================================================
   CONTI MULTIPLI — ogni operazione appartiene a un conto tramite
   accountId. Il filtro (STATE.accountFilter) guida saldo, grafico
   e tutte le statistiche: "all" = aggregato su tutti i conti,
   altrimenti solo quel conto specifico.
   ============================================================ */
function getFilteredTrades(){
  if(STATE.accountFilter==='all') return STATE.trades;
  return STATE.trades.filter(t=>t.accountId===STATE.accountFilter);
}
function accountCapitalBase(acc){
  const txNet = (acc.transactions||[]).reduce((s,tx)=> s + (tx.type==='deposit' ? tx.amount : -tx.amount), 0);
  return acc.startingCapital + txNet;
}
function getEffectiveCapital(){
  if(STATE.accountFilter==='all'){
    return STATE.accounts.reduce((s,a)=>s+accountCapitalBase(a), 0);
  }
  const acc = STATE.accounts.find(a=>a.id===STATE.accountFilter);
  return acc ? accountCapitalBase(acc) : 0;
}
function getActiveAccount(){
  if(STATE.accountFilter==='all') return null;
  return STATE.accounts.find(a=>a.id===STATE.accountFilter) || null;
}
function accountBalanceNow(acc){
  const pnl = STATE.trades.filter(t=>t.accountId===acc.id).reduce((s,t)=>s+t.pnl, 0);
  return accountCapitalBase(acc) + pnl;
}
// riepilogo fondi su TUTTI i conti esistenti (quelli eliminati non esistono più
// in STATE.accounts, quindi sono automaticamente esclusi)
function computeFundsSummary(){
  let totalInvested = 0, totalWithdrawn = 0, currentBalance = 0;
  STATE.accounts.forEach(acc=>{
    totalInvested += acc.startingCapital;
    (acc.transactions||[]).forEach(tx=>{
      if(tx.type==='deposit') totalInvested += tx.amount;
      else totalWithdrawn += tx.amount;
    });
    currentBalance += accountBalanceNow(acc);
  });
  const netInvested = totalInvested - totalWithdrawn;
  const netPerformance = currentBalance - netInvested; // = P&L complessivo di trading, al netto dei movimenti di cassa
  return { totalInvested, totalWithdrawn, netInvested, currentBalance, netPerformance };
}

/* ============================================================
   CAMBIO USD/EUR — Frankfurter (Banca Centrale Europea), gratuito,
   senza chiave, CORS abilitato: può essere richiamato direttamente
   dal browser. Se la rete non è raggiungibile o il servizio non
   risponde, l'interfaccia mostra un errore chiaro invece di rompersi.
   ============================================================ */
async function fetchExchangeRate(){
  STATE.exchangeRateLoading = true;
  STATE.exchangeRateError = null;
  render();
  try{
    const res = await fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR');
    if(!res.ok) throw new Error('Risposta non valida dal servizio di cambio.');
    const data = await res.json();
    if(!data.rates || typeof data.rates.EUR !== 'number') throw new Error('Formato risposta inatteso.');
    STATE.exchangeRate = data.rates.EUR;
    STATE.exchangeRateFetchedAt = new Date().toISOString();
    STATE.exchangeRateError = null;
  }catch(err){
    STATE.exchangeRateError = 'Non sono riuscito a recuperare il cambio in questo momento. Riprova tra poco.';
  }
  STATE.exchangeRateLoading = false;
  render();
}

function nextAccountName(){
  let n = STATE.accounts.length + 1;
  while(STATE.accounts.some(a=>a.name===`Conto ${n}`)) n++;
  return `Conto ${n}`;
}
async function createAccount(startingCapital, name){
  const acc = {
    id: 'acc-'+Date.now(),
    name: name || nextAccountName(),
    startingCapital: Math.round(startingCapital*100)/100,
    transactions: [],
    paused: false,
    createdAt: new Date().toISOString()
  };
  STATE.accounts.push(acc);
  STATE.accountFilter = acc.id;
  STATE.showAddAccount = false;
  await saveAccounts(STATE.accounts);
  return acc;
}
// registra un deposito o un prelievo sul conto — è l'unico modo in cui il
// saldo cambia al di fuori delle operazioni di trading vere e proprie
async function addTransaction(accountId, type, amount, note){
  const acc = STATE.accounts.find(a=>a.id===accountId);
  if(!acc) return;
  if(!acc.transactions) acc.transactions = [];
  acc.transactions.push({
    id: 'tx-'+Date.now(),
    type, // 'deposit' | 'withdrawal'
    amount: Math.round(amount*100)/100,
    date: new Date().toISOString().slice(0,10),
    note: note || ''
  });
  await saveAccounts(STATE.accounts);
}
async function updateTransaction(accountId, txId, updates){
  const acc = STATE.accounts.find(a=>a.id===accountId);
  if(!acc || !acc.transactions) return;
  const tx = acc.transactions.find(t=>t.id===txId);
  if(!tx) return;
  Object.assign(tx, updates);
  await saveAccounts(STATE.accounts);
}
async function deleteTransaction(accountId, txId){
  const acc = STATE.accounts.find(a=>a.id===accountId);
  if(!acc || !acc.transactions) return;
  acc.transactions = acc.transactions.filter(t=>t.id!==txId);
  await saveAccounts(STATE.accounts);
}
// riattiva UN conto già esistente (non ne crea uno nuovo): se il saldo è già
// positivo basta sbloccarlo, altrimenti l'importo inserito diventa un vero
// deposito registrato nello storico transazioni del conto
async function unlockAccountSimple(accountId){
  const acc = STATE.accounts.find(a=>a.id===accountId);
  if(!acc) return;
  acc.paused = false;
  await saveAccounts(STATE.accounts);
}
async function unlockAccountWithDeposit(accountId, newDepositAmount){
  const acc = STATE.accounts.find(a=>a.id===accountId);
  if(!acc) return;
  await addTransaction(accountId, 'deposit', newDepositAmount, 'Deposito per sblocco conto');
  acc.paused = false;
  await saveAccounts(STATE.accounts);
}
async function togglePauseAccount(accountId){
  const acc = STATE.accounts.find(a=>a.id===accountId);
  if(!acc) return;
  acc.paused = !acc.paused;
  await saveAccounts(STATE.accounts);
}
async function togglePauseActiveAccount(){
  const acc = getActiveAccount();
  if(!acc) return;
  await togglePauseAccount(acc.id);
}
async function deleteAccount(accountId){
  STATE.accounts = STATE.accounts.filter(a=>a.id!==accountId);
  STATE.trades = STATE.trades.filter(t=>t.accountId!==accountId);
  if(STATE.accountFilter===accountId) STATE.accountFilter = 'all';
  await saveAccounts(STATE.accounts);
  await saveTrades(STATE.trades);
}

  for(const acc of STATE.accounts){

    if(tx) return { account: acc, tx };
  }
  return null;
}

    <div><span class="k">ID</span><span class="val gold">${t.id}</span></div>
    <div><span class="k">Tipo operazione</span><span class="val"><span class="side-tag ${side==='Sell'?'sell':'buy'}">${side==='Sell'?'SELL':'BUY'}</span></span></div>
    <div><span class="k">Prezzo di entrata</span><span class="val">${t.openPrice}</span></div>
    <div><span class="k">Prezzo di uscita</span><span class="val">${t.closePrice}</span></div>
    <div><span class="k">Size</span><span class="val">${t.volume} lotti</span></div>
    <div><span class="k">Pips <span style="opacity:.55;">(1 pip = 0,01)</span></span><span class="val">${pips.toFixed(1)}</span></div>
    <div><span class="k">Data</span><span class="val">${fmtDateIT(t.closeDate)}</span></div>
  </div>`;
}

/* ============================================================
   CHARTS (pure SVG, no libs)
   ============================================================ */
function equityLayout(points, capital){
  const W=1080, H=220, padL=54, padR=14, padT=16, padB=26;
  const ys = points.map(p=>p.y);
  let minY = Math.min(...ys, capital), maxY = Math.max(...ys, capital);
  const span = (maxY-minY) || 1;
  minY -= span*0.08; maxY += span*0.08;
  const xScale = (i) => padL + (i/(points.length-1||1)) * (W-padL-padR);
  const yScale = (v) => padT + (1-(v-minY)/(maxY-minY)) * (H-padT-padB);
  return {W,H,padL,padR,padT,padB,minY,maxY,xScale,yScale};
}

function renderEquitySVG(points, capital){
  const {W,H,padL,padR,padT,minY,maxY,xScale,yScale} = equityLayout(points, capital);

  const linePts = points.map((p,i)=>`${xScale(i).toFixed(1)},${yScale(p.y).toFixed(1)}`).join(' ');
  const areaPts = `${padL},${yScale(minY).toFixed(1)} ${linePts} ${xScale(points.length-1).toFixed(1)},${yScale(minY).toFixed(1)}`;
  const capY = yScale(capital);

  // gridlines (4 horizontal)
  let grid = '';
  for(let i=0;i<=3;i++){
    const v = minY + (maxY-minY)*i/3;
    const y = yScale(v);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#1E232B" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#585D66" font-family="IBM Plex Mono">${Math.round(v)}</text>`;
  }

  const last = points[points.length-1];
  const lastColor = last.y >= capital ? '#5FA989' : '#C15C4A';

  return `
  <div class="eq-chart-wrap" id="eqChartWrap" style="position:relative;">
    <svg id="eqSvg" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="eqfill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C6A15B" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#C6A15B" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="eqRevealClip"><rect id="eqClipRect" x="${padL}" y="0" width="0" height="${H}"/></clipPath>
      </defs>
      ${grid}
      <line x1="${padL}" y1="${capY.toFixed(1)}" x2="${W-padR}" y2="${capY.toFixed(1)}" stroke="#585D66" stroke-width="1" stroke-dasharray="3,4"/>
      <text x="${W-padR}" y="${(capY-6).toFixed(1)}" text-anchor="end" font-size="10" fill="#585D66" font-family="IBM Plex Mono">capitale iniziale</text>
      <g clip-path="url(#eqRevealClip)">
        <polygon points="${areaPts}" fill="url(#eqfill)"/>
        <polyline id="eqLine" points="${linePts}" fill="none" stroke="#C6A15B" stroke-width="2"/>
      </g>
      <circle id="eqEndDot" cx="${xScale(points.length-1).toFixed(1)}" cy="${yScale(last.y).toFixed(1)}" r="3.5" fill="${lastColor}"/>
      <circle id="eqPulseRing" cx="${xScale(points.length-1).toFixed(1)}" cy="${yScale(last.y).toFixed(1)}" r="4" fill="none" stroke="${lastColor}" stroke-width="2"/>
      <circle id="eqComet" cx="0" cy="0" r="3" fill="#E4C888" opacity="0"/>
      <text id="eqTravelLabel" x="0" y="0" text-anchor="middle" font-size="11" font-weight="600" font-family="IBM Plex Mono" fill="#E4C888" opacity="0"></text>
      <line id="eqGuide" x1="0" y1="${padT}" x2="0" y2="${H-26}" stroke="#8B8F98" stroke-width="1" stroke-dasharray="2,3" opacity="0"/>
      <circle id="eqDot" cx="0" cy="0" r="4" fill="#E4C888" stroke="#0B0D10" stroke-width="1.5" opacity="0"/>
      <rect id="eqHitArea" x="${padL}" y="0" width="${W-padL-padR}" height="${H}" fill="transparent" style="cursor:crosshair;"/>
    </svg>
    <div id="eqTooltip" style="position:absolute;top:0;left:0;pointer-events:none;opacity:0;transition:opacity .1s;background:#1B1F26;border:1px solid #C6A15B;padding:6px 10px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#EDEAE3;white-space:nowrap;z-index:5;">
    </div>
  </div>`;
}

function attachEquityInteractivity(points, capital){
  const wrap = document.getElementById('eqChartWrap');
  if(!wrap) return;
  const svg = document.getElementById('eqSvg');
  const hitArea = document.getElementById('eqHitArea');
  const guide = document.getElementById('eqGuide');
  const dot = document.getElementById('eqDot');
  const tooltip = document.getElementById('eqTooltip');
  const {W,H,padT,padB,xScale,yScale} = equityLayout(points, capital);

  function indexFromClientX(clientX){
    const rect = svg.getBoundingClientRect();
    const svgX = (clientX - rect.left) / rect.width * W;
    const ratio = Math.max(0, Math.min(1, (svgX - equityLayout(points,capital).padL) / (W - equityLayout(points,capital).padL - equityLayout(points,capital).padR)));
    return Math.round(ratio * (points.length-1));
  }

  function showAt(clientX, clientY){
    const idx = indexFromClientX(clientX);
    const p = points[idx];
    if(!p) return;
    const x = xScale(idx), y = yScale(p.y);
    guide.setAttribute('x1', x); guide.setAttribute('x2', x); guide.setAttribute('opacity','1');
    dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('opacity','1');

    const rect = svg.getBoundingClientRect();
    const pxX = (x / W) * rect.width;
    const pxY = (y / H) * rect.height;
    const dateLabel = idx===0 ? 'Capitale di partenza' : fmtDateIT(p.date);
    tooltip.innerHTML = `<div style="color:#8B8F98;font-size:10px;margin-bottom:2px;">${dateLabel}</div><div style="color:${p.y>=capital?'#5FA989':'#C15C4A'};font-weight:600;">${fmtMoney(p.y)}</div>`;
    tooltip.style.opacity = '1';
    let left = pxX + 12;
    if(left + 130 > rect.width) left = pxX - 142;
    tooltip.style.left = left + 'px';
    tooltip.style.top = Math.max(0, pxY - 44) + 'px';
  }

  function hide(){
    guide.setAttribute('opacity','0');
    dot.setAttribute('opacity','0');
    tooltip.style.opacity = '0';
  }

  hitArea.addEventListener('mousemove', (e)=> showAt(e.clientX, e.clientY));
  hitArea.addEventListener('mouseleave', hide);
  hitArea.addEventListener('touchmove', (e)=>{
    if(e.touches && e.touches[0]){ showAt(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, {passive:false});
  hitArea.addEventListener('touchend', hide);
}

function renderDailyBarsSVG(daily, zoom){
  if(!daily.length) return '<div style="color:#585D66;font-size:12px;padding:20px 0;">Nessun dato</div>';
  zoom = zoom || 1;
  const H=200, padL=40, padR=16, padT=10, padB=26;
  const slot = 34*zoom; // larghezza dello "slot" di ogni giorno, in px reali — lo zoom agisce qui
  const W = Math.max(500, padL+padR+daily.length*slot);
  const maxAbs = Math.max(...daily.map(d=>Math.abs(d.pnl)), 1);
  const zeroY = padT + (H-padT-padB)/2;
  const scale = (H-padT-padB)/2 / maxAbs;
  let bars = '';
  daily.forEach((d,i)=>{
    const x = padL + i*slot + slot*0.15;
    const w = slot*0.7;
    const h = Math.abs(d.pnl)*scale;
    const y = d.pnl>=0 ? zeroY-h : zeroY;
    const color = d.pnl>=0 ? '#5FA989' : '#C15C4A';
    const origin = d.pnl>=0 ? '' : ' origin-top';
    bars += `<rect class="bar-grow day-bar${origin}" data-date="${d.date}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" fill="${color}" opacity="0.85"/>`;
  });
  return `<div class="day-chart-wrap" id="dayChartWrap" style="position:relative;">
    <div class="day-chart-scroll" id="dayChartScroll">
      <svg id="dayChartSvg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
        <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="#262B33" stroke-width="1"/>
        ${bars}
      </svg>
    </div>
    <div id="dayCard" class="day-card"></div>
  </div>`;
}

function attachDailyBarInteractivity(daily){
  const wrap = document.getElementById('dayChartWrap');
  const svg = document.getElementById('dayChartSvg');
  const card = document.getElementById('dayCard');
  if(!wrap || !svg || !card) return;
  const byDate = {};
  daily.forEach(d=> byDate[d.date]=d);
  let activeBar = null;
  let hideTimer = null;

  function showCard(bar){
    const d = byDate[bar.dataset.date];
    if(!d) return;
    clearTimeout(hideTimer);
    if(activeBar && activeBar!==bar) resetBar(activeBar);
    activeBar = bar;
    bar.style.transition = 'transform .18s ease, filter .18s ease';
    bar.style.filter = 'brightness(1.45) drop-shadow(0 0 11px rgba(198,161,91,.8)) drop-shadow(0 3px 6px rgba(0,0,0,.45))';
    bar.style.transform = 'scaleY(1.09)';

    const wins = d.trades.filter(t=>t.pnl>0).length;
    const losses = d.trades.filter(t=>t.pnl<0).length;
    const dots = d.trades.map(t=>
      `<span class="day-dot ${t.pnl>=0?'win':'loss'}" title="${t.id} · ${fmtMoney(t.pnl,true)}"></span>`
    ).join('');

    card.innerHTML = `
      <div class="day-card-date">${dowLabel(d.date)} ${fmtDateIT(d.date)}</div>
      <div class="day-card-pnl ${d.pnl>=0?'pos':'neg'}">${fmtMoney(d.pnl,true)}</div>
      <div class="day-card-sub">${d.trades.length} op. — ${wins} vinte, ${losses} perse</div>
      <div class="day-card-dots">${dots}</div>
    `;

    const svgRect = svg.getBoundingClientRect();
    const wrapRect = wrap.getBoundingClientRect();
    const bx = parseFloat(bar.getAttribute('x')), bw = parseFloat(bar.getAttribute('width'));
    const vb = svg.viewBox.baseVal;
    const scaleX = svgRect.width / vb.width;
    const centerViewportX = svgRect.left + (bx + bw/2) * scaleX; // coordinata reale nella finestra, non nel contenitore

    const cardW = 152; // larghezza fissa impostata in CSS: nessuna misura asincrona, nessun salto
    let left = centerViewportX - cardW/2;
    left = Math.max(wrapRect.left+4, Math.min(left, wrapRect.right - cardW - 4));
    card.style.left = left+'px';
    card.style.bottom = (window.innerHeight - wrapRect.top + 9) + 'px'; // ancorata sopra il grafico, in coordinate reali: ignora qualunque overflow:hidden degli antenati
    card.classList.add('open');
  }

  function resetBar(bar){
    bar.style.filter = '';
    bar.style.transform = '';
  }

  function hideCard(){
    if(activeBar){ resetBar(activeBar); activeBar=null; }
    card.classList.remove('open');
  }

  svg.querySelectorAll('.day-bar').forEach(bar=>{
    bar.style.cursor = 'pointer';
    bar.addEventListener('mouseenter', ()=> showCard(bar));
    bar.addEventListener('mouseleave', ()=>{ hideTimer = setTimeout(hideCard, 60); });
    bar.addEventListener('touchstart', (e)=>{ e.preventDefault(); showCard(bar); }, {passive:false});
  });
  wrap.addEventListener('mouseleave', hideCard);
}

function setDailyZoomValue(z){
  STATE.dailyZoom = Math.round(Math.max(DAILY_ZOOM_LEVELS[0], Math.min(DAILY_ZOOM_LEVELS[DAILY_ZOOM_LEVELS.length-1], z))*100)/100;
  render();
}

function attachDailyChartGestures(){
  const scrollDiv = document.getElementById('dayChartScroll');
  const svg = document.getElementById('dayChartSvg');
  if(!scrollDiv || !svg) return;
  const ZOOM_MIN = DAILY_ZOOM_LEVELS[0], ZOOM_MAX = DAILY_ZOOM_LEVELS[DAILY_ZOOM_LEVELS.length-1];

  // --- pizzico con due dita (touch) — anteprima live con transform, valore vero applicato a fine gesto ---
  let pinchStartDist = null, pinchStartZoom = STATE.dailyZoom, pinchOriginPct = 50, liveZoom = STATE.dailyZoom;

  function touchDist(touches){
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  scrollDiv.addEventListener('touchstart', (e)=>{
    if(e.touches.length===2){
      pinchStartDist = touchDist(e.touches);
      pinchStartZoom = STATE.dailyZoom;
      liveZoom = pinchStartZoom;
      const svgRect = svg.getBoundingClientRect();
      const midX = (e.touches[0].clientX + e.touches[1].clientX)/2;
      pinchOriginPct = svgRect.width>0 ? Math.max(0,Math.min(100,(midX-svgRect.left)/svgRect.width*100)) : 50;
      svg.style.transformOrigin = `${pinchOriginPct}% 50%`;
      svg.style.transition = 'none';
    }
  }, {passive:true});

  scrollDiv.addEventListener('touchmove', (e)=>{
    if(e.touches.length===2 && pinchStartDist){
      e.preventDefault();
      const dist = touchDist(e.touches);
      const ratio = dist/pinchStartDist;
      liveZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinchStartZoom*ratio));
      svg.style.transform = `scaleX(${liveZoom/pinchStartZoom})`; // solo orizzontale: il contenuto si allarga, il quadrante no
    }
  }, {passive:false});

  function endPinch(){
    if(pinchStartDist!=null){
      pinchStartDist = null;
      svg.style.transform = '';
      svg.style.transformOrigin = '';
      setDailyZoomValue(liveZoom);
    }
  }
  scrollDiv.addEventListener('touchend', endPinch);
  scrollDiv.addEventListener('touchcancel', endPinch);

  // --- pizzico da trackpad: i browser lo inviano come rotellina + Ctrl ---
  let wheelFrame = null;
  scrollDiv.addEventListener('wheel', (e)=>{
    if(!e.ctrlKey) return; // rotellina/scroll normale: lascia lo scorrimento orizzontale nativo
    e.preventDefault();
    const factor = Math.exp(-e.deltaY*0.012);
    const target = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, STATE.dailyZoom*factor));
    STATE.dailyZoom = Math.round(target*100)/100;
    if(wheelFrame) cancelAnimationFrame(wheelFrame);
    wheelFrame = requestAnimationFrame(()=> render());
  }, {passive:false});
}

function renderWeeklyBarsSVG(weeks, highlightBestWorst){
  const withTrades = weeks.filter(w=>w.trades>0);
  if(!withTrades.length) return '<div style="color:#585D66;font-size:12px;padding:20px 0;">Nessun dato</div>';
  const W=1080, H=220, padL=64, padR=14, padT=24, padB=40;
  const maxAbs = Math.max(...withTrades.map(w=>Math.abs(w.pnl)), 1);
  const bw = (W-padL-padR)/withTrades.length;
  const zeroY = padT + (H-padT-padB)/2;
  const scale = (H-padT-padB)/2 / maxAbs;
  const bestKey = highlightBestWorst ? highlightBestWorst.best.weekStart : null;
  const worstKey = highlightBestWorst ? highlightBestWorst.worst.weekStart : null;
  let bars = '', labels = '';
  withTrades.forEach((w,i)=>{
    const x = padL + i*bw + bw*0.28;
    const bwid = bw*0.44;
    const h = Math.abs(w.pnl)*scale;
    const y = w.pnl>=0 ? zeroY-h : zeroY;
    let color = w.pnl>=0 ? '#5FA989' : '#C15C4A';
    let strokeAttr = '';
    if(w.weekStart===bestKey) strokeAttr = `stroke="#E4C888" stroke-width="1.5"`;
    if(w.weekStart===worstKey) strokeAttr = `stroke="#E4C888" stroke-width="1.5" stroke-dasharray="2,2"`;
    const origin = w.pnl>=0 ? '' : ' origin-top';
    bars += `<rect class="bar-grow${origin}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwid.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" fill="${color}" opacity="0.88" ${strokeAttr}><title>${fmtDateIT(w.weekStart)} — ${fmtDateIT(w.weekEnd)}: ${fmtMoney(w.pnl,true)} (${w.trades} op.)</title></rect>`;
    const lx = x + bwid/2;
    const valY = w.pnl>=0 ? y-8 : y+h+16;
    labels += `<text x="${lx.toFixed(1)}" y="${valY.toFixed(1)}" text-anchor="middle" font-size="13" font-weight="600" fill="${color}" font-family="IBM Plex Mono">${fmtMoney(w.pnl,true)}</text>`;
    labels += `<text x="${lx.toFixed(1)}" y="${H-14}" text-anchor="middle" font-size="13" fill="#8B8F98" font-family="IBM Plex Mono">${fmtDateIT(w.weekStart).slice(0,5)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="#262B33" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}

function renderWeeklyDrawdownSVG(weeks){
  const withTrades = weeks.filter(w=>w.trades>0);
  if(!withTrades.length) return '<div style="color:#585D66;font-size:12px;padding:20px 0;">Nessun dato</div>';

    grid += `<text x="${padL-10}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="12" fill="#8B8F98" font-family="IBM Plex Mono">-${v.toFixed(0)}%</text>`;
  }
  withTrades.forEach((w,i)=>{
    const x = padL + i*bw + bw*0.28;
    const bwid = bw*0.44;
    const h = w.weekDDpct*scale;
    const y = padT + (H-padT-padB) - h;
    bars += `<rect class="bar-grow" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwid.toFixed(1)}" height="${Math.max(h,0.5).toFixed(1)}" fill="#C15C4A" opacity="0.85"><title>${fmtDateIT(w.weekStart)} — ${fmtDateIT(w.weekEnd)}: −${w.weekDDpct.toFixed(1)}% (da ${fmtMoney(w.weekStartBalance)})</title></rect>`;
    const lx = x + bwid/2;
    labels += `<text x="${lx.toFixed(1)}" y="${H-14}" text-anchor="middle" font-size="13" fill="#8B8F98" font-family="IBM Plex Mono">${fmtDateIT(w.weekStart).slice(0,5)}</text>`;
    if(w.weekDDpct>0){

    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg">
    ${grid}
    <line x1="${padL}" y1="${padT + (H-padT-padB)}" x2="${W-padR}" y2="${padT + (H-padT-padB)}" stroke="#262B33" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}


/* ============================================================
   RENDER
   ============================================================ */
function dowIndexMonFirst(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  return (d.getDay()+6)%7; // 0=Lun ... 6=Dom
}
const DOW_ABBR = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];

function applyFiltersAndSort(trades){
  let list = [...trades];
  if(STATE.filterResult==='win') list = list.filter(t=>t.pnl>0);
  if(STATE.filterResult==='loss') list = list.filter(t=>t.pnl<0);
  if(STATE.filterSide!=='all') list = list.filter(t=>impliedSide(t)===STATE.filterSide);
  if(STATE.filterDows.size>0) list = list.filter(t=>STATE.filterDows.has(dowIndexMonFirst(t.closeDate)));
  if(STATE.search.trim()){
    const q = STATE.search.trim().toLowerCase();
    list = list.filter(t => t.id.toLowerCase().includes(q) || t.symbol.toLowerCase().includes(q));
  }
  list.sort((a,b)=>{
    let av, bv;
    if(STATE.sortKey==='closeDateTime'){ av=dt(a); bv=dt(b); }
    else { av=a[STATE.sortKey]; bv=b[STATE.sortKey]; }
    if(av<bv) return STATE.sortDir==='asc'?-1:1;
    if(av>bv) return STATE.sortDir==='asc'?1:-1;
    return 0;
  });
  return list;
}

function filterCounts(trades){
  return {
    all: trades.length,
    win: trades.filter(t=>t.pnl>0).length,
    loss: trades.filter(t=>t.pnl<0).length,
    Sell: trades.filter(t=>impliedSide(t)==='Sell').length,
    Buy: trades.filter(t=>impliedSide(t)==='Buy').length,
    byDow: DOW_ABBR.map((_,i)=>trades.filter(t=>dowIndexMonFirst(t.closeDate)===i).length)
  };
}

function renderCardsSection(){
  const selected = STATE.trades.filter(t=>STATE.selectedIds.has(t.id));
  if(!selected.length) return '';
  const wins = selected.filter(t=>t.pnl>0).sort((a,b)=>b.pnl-a.pnl);
  const losses = selected.filter(t=>t.pnl<=0).sort((a,b)=>a.pnl-b.pnl);

  const scopedTrades = getFilteredTrades();
  const allSorted = [...scopedTrades].sort((a,b)=>dt(a)-dt(b));
  const accountAvgHold = scopedTrades.length ? scopedTrades.map(holdMinutes).reduce((a,b)=>a+b,0)/scopedTrades.length : 0;

function initRevealObserver(){
  if(!('IntersectionObserver' in window)){
    revealObserver = null;
    return;
  }
  revealObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting) return;
      const id = entry.target.dataset.revealId;
      entry.target.classList.add('in');
      STATE.revealed.add(id);
      revealObserver.unobserve(entry.target);
      animateBarsIn(entry.target);
      if(id==='hero') animateHeroExtras(lastEquityPoints, lastEquityCapital);
    });
  }, {threshold:0.12});
}

function positionToolNavIndicator(){
  const nav = document.getElementById('toolNav');
  const indicator = document.getElementById('toolNavIndicator');
  const activeTab = nav ? nav.querySelector('.tool-tab.active') : null;
  if(!nav || !indicator || !activeTab) return;

  const navRect = nav.getBoundingClientRect();
  const tabRect = activeTab.getBoundingClientRect();
  const target = { left: tabRect.left - navRect.left, width: tabRect.width };

  if(!lastToolIndicatorRect){
    indicator.style.transition = 'none';
    indicator.style.left = target.left+'px';
    indicator.style.width = target.width+'px';
    void indicator.offsetWidth;
    indicator.style.transition = '';
  } else {
    indicator.style.transition = 'none';
    indicator.style.left = lastToolIndicatorRect.left+'px';
    indicator.style.width = lastToolIndicatorRect.width+'px';
    void indicator.offsetWidth;
    indicator.style.transition = 'left .32s cubic-bezier(.16,1,.3,1), width .32s cubic-bezier(.16,1,.3,1)';
    requestAnimationFrame(()=>{
      indicator.style.left = target.left+'px';
      indicator.style.width = target.width+'px';
    });
  }
  lastToolIndicatorRect = target;
}

function attachRevealObserver(currentBalance){
  const nodes = document.querySelectorAll('[data-reveal-id]');
  if(!revealObserver){
    // niente IntersectionObserver disponibile: mostra tutto subito, senza animazione
    nodes.forEach(el=>{
      el.classList.add('in');
      STATE.revealed.add(el.dataset.revealId);
      animateBarsIn(el, true);
      if(el.dataset.revealId==='hero') settleEquityChart(lastEquityPoints, lastEquityCapital);
    });
    return;
  }
  nodes.forEach(el=>{
    const id = el.dataset.revealId;
    if(STATE.revealed.has(id)){
      el.classList.add('in'); // già vista in questa sessione: niente rianimazione
      animateBarsIn(el, true);
      if(id==='hero') settleEquityChart(lastEquityPoints, lastEquityCapital);
      return;
    }
    revealObserver.observe(el);
  });
}

function settleEquityChart(points, capital){
  // porta il grafico direttamente allo stato finale, senza animazione:
  // usato quando la sezione era già stata rivelata prima di un nuovo render
  // (es. un filtro cliccato), dato che il render ricrea l'SVG da capo.
  const clipRect = document.getElementById('eqClipRect');
  const line = document.getElementById('eqLine');
  const endDot = document.getElementById('eqEndDot');
  if(!clipRect || !points || !points.length) return;
  const layout = equityLayout(points, capital);
  clipRect.setAttribute('width', layout.W);
  if(line){ line.style.strokeDasharray = 'none'; line.style.strokeDashoffset = '0'; line.dataset.drawn='1'; }
  if(endDot) endDot.classList.add('shown');
}

function animateBarsIn(container, instant){
  const bars = container.querySelectorAll('.bar-grow:not(.grown)');
  if(!bars.length) return;
  bars.forEach((b,i)=>{
    b.style.transitionDelay = instant ? '0ms' : Math.min(i*18, 260)+'ms';
  });
  if(instant){
    bars.forEach(b=> b.classList.add('grown'));
  } else {
    requestAnimationFrame(()=> requestAnimationFrame(()=>{
      bars.forEach(b=> b.classList.add('grown'));
    }));
  }
}

function animateHeroExtras(points, capital){
  // conteggio del saldo verso l'alto
  const numEl = document.getElementById('heroBalanceNum');
  if(numEl && !numEl.dataset.counted){
    numEl.dataset.counted = '1';
    const target = parseFloat(numEl.dataset.target || '0') || (function(){
      const t = numEl.textContent.replace(/[^0-9,.-]/g,'').replace(',','.');
      return parseFloat(t)||0;
    })();
    const start = 0;
    const duration = 950;
    const t0 = performance.now();
    function tick(now){
      const p = Math.min(1, (now-t0)/duration);
      const eased = 1 - Math.pow(1-p, 3); // ease-out cubic
      const val = start + (target-start)*eased;
      numEl.textContent = fmtMoney(val);
      if(p<1) requestAnimationFrame(tick);
      else numEl.textContent = fmtMoney(target);
    }
    requestAnimationFrame(tick);
  }
  animateEquityJourney(points, capital);
}

function animateEquityJourney(points, capital){
  const line = document.getElementById('eqLine');
  if(!line || !line.getTotalLength || !points || !points.length || line.dataset.drawn) return;
  line.dataset.drawn = '1';

  const clipRect = document.getElementById('eqClipRect');
  const comet = document.getElementById('eqComet');
  const label = document.getElementById('eqTravelLabel');
  const endDot = document.getElementById('eqEndDot');
  const pulseRing = document.getElementById('eqPulseRing');
  const wrap = document.getElementById('eqChartWrap');
  const layout = equityLayout(points, capital);
  const totalLen = line.getTotalLength();

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion){
    settleEquityChart(points, capital);
    return;
  }

  line.style.strokeDasharray = totalLen;
  line.style.strokeDashoffset = totalLen;
  clipRect.setAttribute('width', 0);
  if(comet) comet.setAttribute('opacity','1');
  if(label) label.setAttribute('opacity','1');
  if(wrap) wrap.classList.add('journeying');

  const duration = Math.min(2600, Math.max(1300, points.length*42));
  const t0 = performance.now();
  const ease = p => 1 - Math.pow(1-p, 3); // easeOutCubic

  function frame(now){
    const p = Math.min(1, (now-t0)/duration);
    const e = ease(p);

    line.style.strokeDashoffset = totalLen*(1-e);
    clipRect.setAttribute('width', Math.max(0, layout.W*e).toFixed(1));

    const floatIdx = e*(points.length-1);
    const i0 = Math.floor(floatIdx), i1 = Math.min(points.length-1, i0+1);
    const frac = floatIdx-i0;
    const p0 = points[i0], p1 = points[i1];
    const curY = p0.y + (p1.y-p0.y)*frac;
    const cx = layout.xScale(floatIdx), cy = layout.yScale(curY);

    if(comet){ comet.setAttribute('cx', cx.toFixed(1)); comet.setAttribute('cy', cy.toFixed(1)); }
    if(label){
      label.setAttribute('x', cx.toFixed(1));
      label.setAttribute('y', (cy-12).toFixed(1));
      label.textContent = fmtMoney(curY);
    }

    if(p<1){
      requestAnimationFrame(frame);
    } else {
      if(comet) comet.setAttribute('opacity','0');
      if(label) label.setAttribute('opacity','0');
      if(endDot) endDot.classList.add('shown');
      if(pulseRing) pulseRing.classList.add('firing');
      if(wrap) setTimeout(()=> wrap.classList.remove('journeying'), 400);
    }
  }
  requestAnimationFrame(frame);
}

/* ============================================================
   EVENTS
   ============================================================ */
function attachHandlers(){
  document.querySelectorAll('thead th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      if(STATE.sortKey===key) STATE.sortDir = STATE.sortDir==='asc'?'desc':'asc';
      else { STATE.sortKey=key; STATE.sortDir='desc'; }
      render();
    });
  });
  document.querySelectorAll('.chip[data-result]').forEach(c=>{
    c.addEventListener('click', ()=>{
      STATE.filterResult = STATE.filterResult===c.dataset.result ? 'all' : c.dataset.result;
      render();
    });
  });
  const clearBtn = document.getElementById('clearFilters');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    STATE.filterResult='all'; STATE.filterSide='all'; STATE.filterDows=new Set(); STATE.showDowPicker=false; STATE.search=''; STATE.showSearchInput=false; render();
  });
  document.querySelectorAll('.chip[data-side]').forEach(c=>{
    c.addEventListener('click', ()=>{
      STATE.filterSide = STATE.filterSide===c.dataset.side ? 'all' : c.dataset.side;
      render();
    });
  });
  const dowToggle = document.getElementById('dowPickerToggle');
  if(dowToggle) dowToggle.addEventListener('click', (e)=>{
    e.stopPropagation();
    STATE.showDowPicker = !STATE.showDowPicker;
    render();
  });
  document.querySelectorAll('.dow-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const i = parseInt(btn.dataset.dow,10);
      if(STATE.filterDows.has(i)) STATE.filterDows.delete(i); else STATE.filterDows.add(i);
      render();
    });
  });
  if(STATE.showDowPicker){
    document.addEventListener('click', function closeDowPicker(e){
      if(!e.target.closest('.dow-picker-wrap')){
        STATE.showDowPicker = false;
        document.removeEventListener('click', closeDowPicker);
        render();
      }
    });
  }
  document.querySelectorAll('.opt-delete').forEach(btn=>{
    let confirmTimer = null;
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(btn.dataset.pending==='1'){
        clearTimeout(confirmTimer);
        const id = btn.dataset.id;
        STATE.options = STATE.options.filter(o=>o.id!==id);
        await saveOptions(STATE.options);
        render();
        return;
      }
      btn.dataset.pending='1';
      btn.textContent = '✓ conferma';
      btn.style.color = 'var(--loss)';
      btn.style.fontWeight = '600';
      confirmTimer = setTimeout(()=>{
        if(btn.isConnected){
          btn.dataset.pending='0';
          btn.textContent='✕';
          btn.style.color='';
          btn.style.fontWeight='';
        }
      }, 3000);
    });
  });

  const btnAddOption = document.getElementById('btnAddOption');
  if(btnAddOption) btnAddOption.addEventListener('click', async ()=>{
    const statusEl = document.getElementById('optionStatus');
    const symbol = document.getElementById('optSymbol').value.trim() || 'XAUUSD';
    const type = document.getElementById('optType').value;
    const strike = parseFloat(document.getElementById('optStrike').value);
    const contracts = parseInt(document.getElementById('optContracts').value, 10);
    const expiration = document.getElementById('optExpiration').value;
    const note = document.getElementById('optNote').value.trim();
    if(isNaN(strike) || isNaN(contracts) || !expiration){
      showStatus(statusEl, 'err', 'Compila almeno strike, numero di contratti e data di scadenza.');
      return;
    }
    STATE.options.push({ id:'opt-'+Date.now(), symbol, type, strike, contracts, expiration, note });
    await saveOptions(STATE.options);
    showStatus(statusEl, 'ok', 'Opzione aggiunta.');
    setTimeout(render, 500);
  });

  document.querySelectorAll('.row-delete').forEach(btn=>{
    let confirmTimer = null;
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(btn.dataset.pending==='1'){
        clearTimeout(confirmTimer);
        const id = btn.dataset.id;
        STATE.trades = STATE.trades.filter(t=>t.id!==id);
        STATE.selectedIds.delete(id);
        await saveTrades(STATE.trades);
        render();
        return;
      }
      btn.dataset.pending='1';
      btn.textContent = '✓ conferma';
      btn.style.color = 'var(--loss)';
      btn.style.fontWeight = '600';
      confirmTimer = setTimeout(()=>{
        if(btn.isConnected){
          btn.dataset.pending='0';
          btn.textContent='✕';
          btn.style.color='';
          btn.style.fontWeight='';
        }
      }, 3000);
    });
  });

  async function importTradesFromText(text, statusEl){
    if(!text || !text.trim()){ showStatus(statusEl,'err','Nessun testo da importare.'); return; }
    const acc = getActiveAccount();
    if(!acc){ showStatus(statusEl,'err','Seleziona un conto specifico (non "Tutti i conti") prima di aggiungere operazioni.'); return; }
    if(acc.paused){ showStatus(statusEl,'err',`${acc.name} è in pausa: riattivalo dalle Impostazioni, o seleziona/crea un altro conto per aggiungere operazioni.`); return; }
    const mult = STATE.settings.contractMultiplier;
    let newTrades = text.includes(',') ? parseCSV(text, mult) : [];
    if(!newTrades.length) newTrades = parseBrokerText(text, mult);
    if(!newTrades.length){
      showStatus(statusEl,'err',"Non sono riuscito a riconoscere il formato. Prova con l'inserimento manuale.");
      return;
    }
    newTrades = newTrades.map(t=>({...t, accountId: acc.id}));
    const existingIds = new Set(STATE.trades.map(t=>t.id));
    const toAdd = newTrades.filter(t=>!existingIds.has(t.id));
    const dupes = newTrades.length - toAdd.length;
    STATE.trades = [...STATE.trades, ...toAdd];
    await saveTrades(STATE.trades);
    showStatus(statusEl,'ok', `Aggiunte ${toAdd.length} operazioni a ${acc.name}${dupes?` (${dupes} già presenti, ignorate)`:''}.`);
    document.getElementById('pasteArea').value='';
    setTimeout(render, 700);
  }

  async function handleFile(file){
    const statusEl = document.getElementById('pasteStatus');
    if(!file){ return; }
    const name = file.name.toLowerCase();
    if(!name.endsWith('.csv') && !name.endsWith('.txt')){
      showStatus(statusEl,'err','Carica un file .csv o .txt.');
      return;
    }
    try{
      const text = await file.text();
      showStatus(statusEl,'ok', `File "${file.name}" caricato, importazione in corso…`);
      await importTradesFromText(text, statusEl);
    }catch(err){
      showStatus(statusEl,'err','Non sono riuscito a leggere il file.');
    }
  }

    });
    ['dragenter','dragover'].forEach(evt=>{
      dropZone.addEventListener(evt, (e)=>{ e.preventDefault(); e.stopPropagation(); dropZone.classList.add('dragover'); });
    });
    ['dragleave','drop'].forEach(evt=>{

    const date = document.getElementById('mDate').value;

    const side = document.getElementById('mSide').value;

    if(!date || isNaN(volume) || isNaN(openPrice) || isNaN(closePrice)){
      showStatus(statusEl,'err','Compila almeno data, volume, prezzo apertura e chiusura.');

    const mult = STATE.settings.contractMultiplier;
    const usingRealPnl = !isNaN(manualPnl);
    const trade = {
      id: 'manual-'+Date.now(), openDate:date, openTime:time, closeDate:date, closeTime:time,
      side, symbol, volume, openPrice, closePrice, commission,
      pnl: usingRealPnl ? manualPnl : calcPnl(side, volume, openPrice, closePrice, commission, mult),
      estimated: !usingRealPnl,
      accountId: acc.id
    };
